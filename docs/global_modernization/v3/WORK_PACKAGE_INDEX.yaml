schema_version: 1
updated_at: "2026-07-23"
project: martyshkin_trud_runner
execution_model: dependency_gated_bounded_patch
runtime_started: false

status_values:
  - complete
  - ready
  - pending
  - blocked
  - conditional

validation_profiles:
  D4: four-gate documentation, contract and planning validation
  P4: static, Web targeted, Android-emulator targeted, regression/review
  M2_PLUS: functional pass, optimization/regression pass, focused recovery when high-risk
  QA7: seven-domain Tasks/4 matrix
  RC2: two independent release-candidate cycles plus artifact parity

common_patch_contract:
  inputs_required:
    - immutable source checkpoint after M00
    - active AGENTS and lore
    - current module report and relevant manifests only
  outputs_required:
    - mini-plan
    - exact diff and rollback mapping
    - machine-readable QA result
    - module report and code-review report
    - updated execution index
  stop_on:
    - unknown failure
    - checkpoint drift
    - missing rollback
    - fatal runtime log
    - content parity mismatch
    - unapproved destructive or physical-device action

modules:
  M00:
    name: repository_baseline_source_freeze_and_git_topology
    priority: P0
    current_status: complete
    depends_on: []
    work_packages:
      - id: M00.1
        status: complete
        objective: Verify Tasks/5 integrity and capture live repository, build and evidence indexes.
        outputs: [docs/current_audit/repository_inventory.md, docs/current_audit/live_git_state.json, docs/current_audit/live_build_artifact_index.json, docs/current_audit/live_evidence_index.json]
        gates: [D4]
      - id: M00.2
        status: complete
        objective: Classify all project-scoped tracked, deleted and untracked entries as source, compact docs/index, generated output, raw evidence or manual review.
        outputs: [docs/global_modernization/v3/M00/source_freeze_classification.yaml]
        gates: [D4]
      - id: M00.3
        status: complete
        objective: Decide Pages topology and primary source remote without staging the nested deployment tree.
        outputs: [docs/global_modernization/v3/M00/git_topology_decision.md]
        gates: [D4]
      - id: M00.4
        status: complete
        objective: Create reviewed source commit, annotated tag and Git bundle containing no builds, secrets, raw evidence or Tasks archives.
        outputs: [docs/global_modernization/v3/M00/source_freeze_report.md]
        gates: [D4]
      - id: M00.5
        status: complete
        objective: Generate canonical source/content fingerprint and protected evidence anchor linked to commit and tag.
        outputs: [docs/global_modernization/v3/M00/source_content_manifest.json, docs/global_modernization/v3/M00/evidence_anchor.json]
        gates: [D4]
      - id: M00.6
        status: complete
        objective: Restore Git bundle into a temporary directory and reproduce static configuration/type/asset gates.
        outputs: [docs/global_modernization/v3/M00/restore_rehearsal_report.md, docs/codex/CURRENT_STATE.md]
        gates: [D4]

