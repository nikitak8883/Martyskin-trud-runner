name: MTR static gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - mtr-source-v3
  push:
    branches:
      - mtr-source-v3

permissions:
  contents: read

concurrency:
  group: mtr-static-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: static-gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Run the canonical static gate
        run: >-
          python tools/codex/quality-gate/bootstrap.py --
          --project-root .
          --config tools/codex/quality-gate/static-gates.json
          --output temp/quality-gate-m01-6/report.json
          --content-version mtr-static-gates-v1

      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mtr-static-gates-${{ runner.os }}
          path: temp/quality-gate-m01-6
          if-no-files-found: error
          retention-days: 14

