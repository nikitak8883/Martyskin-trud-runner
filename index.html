8a'));this.back(c)}else if(this.state===S.LVL){this.txt(c,'ВЫБОР УРОВНЯ',640,200,42,'#8cff8c');for(let i=0;i<10;i++){let en=i<this.unlocked;this.btn(c,170+(i%5)*190,285+Math.floor(i/5)*85,160,55,(en?'':'🔒 ')+(i+1),()=>{if(en)this.start(i)})}this.back(c)}else if(this.state===S.SET){this.txt(c,'ЗВУК',640,200,42,'#8cff8c');this.btn(c,410,300,460,55,'Музыка: '+(this.a.music?'ON':'OFF'),()=>{this.a.music=!this.a.music;this.apply()});this.btn(c,410,370,460,55,'Эффекты: '+(this.a.sfx?'ON':'OFF'),()=>{this.a.sfx=!this.a.sfx;this.apply()});this.back(c)}}back(c){this.btn(c,430,610,420,50,'НАЗАД',()=>this.state=S.MENU)}crane(c){c.strokeStyle='rgba(210,170,70,.7)';c.lineWidth=5;c.beginPath();c.moveTo(950,210);c.lineTo(950,520);c.moveTo(770,230);c.lineTo(1150,230);c.stroke();this.label(c,1080,245,'КРАН\nДУМАЕТ')}scaffold(c,x,y){c.strokeStyle='rgba(130,255,150,.45)';c.lineWidth=3;for(let i=0;i<4;i++){c.strokeRect(x+i*55,y-120,48,120);c.beginPath();c.moveTo(x+i*55,y-120);c.lineTo(x+i*55+48,y);c.moveTo(x+i*55+48,y-120);c.lineTo(x+i*55,y);c.stroke()}c.fillStyle='#7a5732';c.fillRect(x-10,y-65,250,12)}brickwall(c,x,y,t){c.fillStyle='rgba(130,80,50,.55)';c.fillRect(x,y,230,100);this.label(c,x+115,y-20,t)}car(c,x,y,i){c.fillStyle=['#3297d3','#d34e32','#6abc70'][i%3];this.round(c,x,y,120,42,14);c.fill();c.fillStyle='#111';c.beginPath();c.arc(x+25,y+42,12,0,7);c.arc(x+95,y+42,12,0,7);c.fill()}chicken(c,x,y,k){c.fillStyle='#fff8e8';c.beginPath();c.ellipse(x,y,24*k,16*k,0,0,7);c.arc(x+22*k,y-16*k,10*k,0,7);c.fill()}peacock(c,x,y,k){c.strokeStyle='#38d99d';c.lineWidth=4*k;for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(x+22*k,y-20*k);c.lineTo(x+(22+i*18)*k,y-(70-Math.abs(i)*5)*k);c.stroke()}c.fillStyle='#2466d8';c.beginPath();c.ellipse(x+22*k,y-18*k,16*k,26*k,0,0,7);c.fill()}}
