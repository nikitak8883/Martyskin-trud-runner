<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Мартышкин Труд: Web Runner</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#020403;color:#9cff9c;font-family:ui-monospace,Menlo,Consolas,monospace;touch-action:none}
canvas{display:block;width:100vw;height:100vh;background:#050805}
.note{position:fixed;left:8px;bottom:6px;color:#b7ffb799;font:12px monospace;pointer-events:none;letter-spacing:.2px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="note">Web Runner · tap/click enables audio · P/Esc pause · left jump · right dash</div>
<script>
'use strict';
const W=1280,H=720,S={MENU:0,PLAY:1,PAUSE:2,CLEAR:3,OVER:4,WIN:5,SKIN:6,REC:7,LVL:8,SET:9};
const LV=[['Стройплощадка примата','Каска есть. Плана нет. Бананы есть.',430,39000,50,0,'#10202a','#244c3a']];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const hit=(a,b)=>a.x<a.w+b.x&&a.x+a.w>b.x&&a.y<a.h+b.y&&a.y+a.h>b.y;
class Eng{constructor(cv){this.cv=cv;this.ctx=cv.getContext('2d');this.buf=document.createElement('canvas');this.fx=document.createElement('canvas');this.buf.width=this.fx.width=W;this.buf.height=this.fx.height=H;this.b=this.buf.getContext('2d');this.f=this.fx.getContext('2d');this.resize()}resize(){let d=Math.min(2,devicePixelRatio||1);this.cv.width=innerWidth*d;this.cv.height=innerHeight*d;this.ctx.setTransform(d,0,0,d,0,0);this.s=Math.min(innerWidth/W,innerHeight/H);this.ox=(innerWidth-W*this.s)/2;this.oy=(innerHeight-H*this.s)/2}begin(){this.b.clearRect(0,0,W,H);this.f.clearRect(0,0,W,H);return this.b}end(){const c=this.ctx;c.save();c.fillStyle='#020302';c.fillRect(0,0,innerWidth,innerHeight);c.translate(this.ox,this.oy);c.scale(this.s,this.s);c.globalAlpha=.2;c.filter='blur(8px)';c.drawImage(this.buf,-5,-4,W+10,H+8);c.filter='none';c.globalAlpha=1;c.drawImage(this.buf,0,0);this.f.globalCompositeOperation='screen';this.f.globalAlpha=.24;this.f.filter='blur(10px)';this.f.drawImage(this.buf,0,0);this.f.filter='none';this.f.globalAlpha=1;c.drawImage(this.fx,0,0);c.restore()}}
class Game{constructor(){this.e=new Eng(document.getElementById('game'));this.state=S.MENU;this.skin=+localStorage.getItem('skin')||0;this.level=0;this.p={x:250,y:560,vy:0,on:true,double:true};this.buttons=[];this.parts=[];this.bananas=[];this.bind();this.start();addEventListener('resize',()=>this.e.resize());requestAnimationFrame(t=>this.loop(t))}bind(){const down=e=>{let p=(e.touches?e.touches[0]:e),r=this.e.cv.getBoundingClientRect(),x=(p.clientX-r.left-this.e.ox)/this.e.s,y=(p.clientY-r.top-this.e.oy)/this.e.s;this.tap(x,y);e.preventDefault()};this.e.cv.addEventListener('mousedown',down);this.e.cv.addEventListener('touchstart',down,{passive:false})}start(){this.state=S.PLAY;this.progress=0;this.score=0;this.hp=3;this.ban=0;for(let i=0;i<24;i++)this.bananas.push({x:350+i*62,y:510-Math.sin(i*.65)*30,t:false})}tap(x,y){for(const b of this.buttons)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)return b.f();if(this.state===S.PLAY){if(x<W*.6)this.jump();else this.dash()}}jump(){let p=this.p;if(p.on){p.vy=-560;p.on=false;p.double=true}else if(p.double){p.vy=-490;p.double=false}}dash(){this.progress+=90;this.emit(this.p.x+30,this.p.y-34,'#ffe57a',14)}sx(x){return 250+(x-this.progress)}prect(){return{x:this.p.x-24,y:this.p.y-78,w:48,h:74}}upd(dt){let p=this.p;p.vy+=(p.vy>0?1200:1500)*dt;p.y+=p.vy*dt;p.on=false;if(p.y>560){p.y=560;p.vy=0;p.on=true;p.double=true}let pr=this.prect();for(const b of this.bananas){if(b.t)continue;let x=this.sx(b.x);if(hit(pr,{x:x-20,y:b.y-17,w:40,h:34})){b.t=true;this.ban++;this.score+=15;this.emit(x,b.y,'#fff173',10)}}this.parts=this.parts.filter(q=>(q.life-=dt)>0);for(let q of this.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=220*dt}}emit(x,y,c,n){for(let i=0;i<n;i++){let a=Math.random()*7,s=90+Math.random()*250;this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45+Math.random()*.65,size:2+Math.random()*4,c})}}loop(t){let dt=Math.min(.033,(t-(this.last||t))/1000);this.last=t;if(this.state===S.PLAY)this.upd(dt),this.progress+=430*dt;this.draw();requestAnimationFrame(x=>this.loop(x))}
round(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}txt(c,t,x,y,s,col='#fff',a='center'){c.font=(s>20?'700 ':'600 ')+s+'px monospace';c.textAlign=a;c.textBaseline='alphabetic';c.fillStyle=col;c.shadowColor='#000';c.shadowBlur=5;c.fillText(t,x,y);c.shadowBlur=0}
btn(c,x,y,w,h,t,f){this.buttons.push({x,y,w,h,f});c.fillStyle='rgba(18,40,24,.94)';this.round(c,x,y,w,h,13);c.fill();c.strokeStyle='#85ff93';c.lineWidth=2;c.stroke();this.txt(c,t,x+w/2,y+h/2+6,18,'#e8ffe8')}
banana(c,x,y){c.save();c.translate(x,y);c.rotate(-.1);let p=new Path2D();p.moveTo(-28,8);p.bezierCurveTo(-20,-14,8,-19,30,-10);p.bezierCurveTo(36,-2,30,13,17,20);p.bezierCurveTo(2,26,-17,21,-28,8);c.fillStyle='#f5c735';c.fill(p);c.strokeStyle='#8c6110';c.lineWidth=2;c.stroke(p);c.fillStyle='#ffe88f';c.beginPath();c.ellipse(-2,2,16,5,-.18,0,7);c.fill();c.restore()}
monkey(c){let p=this.p,skins=[['#6c4428','#d7af86','#34b34a'],['#7e552e','#f0c6a3','#7ed0ff'],['#3f3431','#cab1a0','#f4a2ff'],['#855825','#f8d19c','#9fff74']],s=skins[this.skin];c.save();c.translate(p.x,p.y);c.fillStyle=s[0];c.beginPath();c.ellipse(0,-38,31,35,0,0,7);c.arc(-25,-67,11,0,7);c.arc(25,-67,11,0,7);c.arc(0,-66,24,0,7);c.fill();c.fillStyle=s[1];c.beginPath();c.ellipse(0,-63,17,14,0,0,7);c.ellipse(0,-32,18,16,0,0,7);c.fill();c.fillStyle=s[0];c.fillRect(-18,-8,12,36);c.fillRect(6,-8,12,36);c.fillStyle='#191919';c.beginPath();c.arc(-7,-67,2.2,0,7);c.arc(7,-67,2.2,0,7);c.fill();c.fillStyle=s[2];this.round(c,-24,-92,48,12,6);c.fill();c.restore()}
skinPreview(c,x,y,i){const old=this.skin;this.skin=i;const oldp={...this.p};this.p={x,y:y+58};this.monkey(c);this.p=oldp;this.skin=old}
draw(){let c=this.e.begin();this.buttons=[];let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10202a');g.addColorStop(1,'#244c3a');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='rgba(0,0,0,.22)';c.fillRect(0,560,W,160);for(const b of this.bananas){if(b.t)continue;let x=this.sx(b.x);if(x>-40&&x<W+40)this.banana(c,x,b.y)}this.monkey(c);for(let q of this.parts){c.fillStyle=q.c;c.globalAlpha=clamp(q.life/.9,0,1);c.beginPath();c.arc(q.x,q.y,q.size,0,7);c.fill();c.globalAlpha=1}this.txt(c,'Стройплощадка примата',30,40,20,'#8cff8c','left');this.txt(c,'Каска есть. Плана нет. Бананы есть.',30,65,14,'#d7ffd7','left');this.txt(c,`BAN ${this.ban}/50   HP ${this.hp}   SCORE ${this.score}`,1248,45,18,'#fff08a','right');if(this.state===S.PLAY)this.btn(c,1125,94,126,42,'ПАУЗА',()=>this.state=S.PAUSE);if(this.state!==S.PLAY){c.fillStyle='rgba(0,0,0,.75)';c.fillRect(0,0,W,H);this.txt(c,'ВЫБЕРИ ПРИМАТА',640,130,40,'#8cff8c');for(let i=0;i<4;i++){this.btn(c,160+i*240,220,190,220,(this.skin===i?'✓ ':'')+'СКИН '+(i+1),()=>{this.skin=i;localStorage.setItem('skin',i)});this.skinPreview(c,255+i*240,260,i)}this.btn(c,430,610,420,52,'В ИГРУ',()=>this.state=S.PLAY)}this.e.end()}}
new Game();
</script>
</body>
</html>
