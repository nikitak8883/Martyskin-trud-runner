const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;

function seededRandom(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function saveLocal(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (_) {}
}

function loadLocal(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return fallback;
    return JSON.parse(raw);
  } catch (_) {
    return fallback;
  }
}

function rectsIntersect(a, b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

/* ===========================
   Audio
=========================== */

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.music = loadLocal("mtr_music", true);
    this.sfx = loadLocal("mtr_sfx", true);
    this.musicVolume = loadLocal("mtr_music_volume", 0.55);
    this.sfxVolume = loadLocal("mtr_sfx_volume", 0.82);
    this.nextMusic = 0;
    this.step = 0;
  }

  ensure() {
    if (this.ctx) return;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    this.ctx = new AudioContextClass();
  }

  resume() {
    this.ensure();
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  }

  save() {
    saveLocal("mtr_music", this.music);
    saveLocal("mtr_sfx", this.sfx);
    saveLocal("mtr_music_volume", this.musicVolume);
    saveLocal("mtr_sfx_volume", this.sfxVolume);
  }

  tone(freq, dur = 0.1, type = "sine", vol = 0.04, delay = 0) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.03);
  }

  chirp(from, to, dur = 0.08, vol = 0.12) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(from, now);
    osc.frequency.exponentialRampToValueAtTime(to, now + dur);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(vol * this.sfxVolume, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.04);
  }

  play(name) {
    if (!this.sfx) return;
    this.resume();

    if (name === "jump") {
      this.chirp(430, 890, 0.10, 0.13);
    } else if (name === "dash") {
      this.chirp(260, 760, 0.12, 0.16);
    } else if (name === "banana") {
      this.chirp(880, 1280, 0.065, 0.09);
      this.tone(1180, 0.08, "square", 0.03 * this.sfxVolume, 0.02);
    } else if (name === "hit") {
      this.chirp(320, 125, 0.15, 0.18);
    } else if (name === "banner") {
      this.chirp(580, 990, 0.09, 0.10);
    } else if (name === "clear") {
      [523, 659, 784, 1046].forEach((f, i) => {
        this.tone(f, 0.12, "square", 0.06 * this.sfxVolume, i * 0.08);
      });
    } else if (name === "monkey") {
      this.chirp(470, 820, 0.08, 0.13);
      this.chirp(660, 980, 0.06, 0.09);
    }
  }

  tickMusic() {
    if (!this.music) return;
    this.resume();
    if (!this.ctx) return;
    if (this.ctx.currentTime < this.nextMusic) return;

    const roots = [196, 220, 262, 220, 175, 196, 220, 262];
    const motif = [2, 2.25, 2.66, 3, 2.66, 2.25, 2, 3];

    const root = roots[Math.floor(this.step / 8) % roots.length];
    const mult = motif[this.step % 8];

    this.tone(root * mult, 0.18, "square", this.musicVolume * 0.045);
    if (this.step % 2 === 0) this.tone(root / 2, 0.12, "sine", this.musicVolume * 0.05);
    if (this.step % 16 === 3 || this.step % 16 === 11) {
      this.chirp(620, 940, 0.07, this.musicVolume * 0.06);
    }

    this.nextMusic = this.ctx.currentTime + 0.25;
    this.step++;
  }
}

/* ===========================
   Advanced Render Engine
=========================== */

class RenderEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");

    this.scene = document.createElement("canvas");
    this.glow = document.createElement("canvas");
    this.ui = document.createElement("canvas");

    this.scene.width = this.glow.width = this.ui.width = LOGICAL_W;
    this.scene.height = this.glow.height = this.ui.height = LOGICAL_H;

    this.sceneCtx = this.scene.getContext("2d");
    this.glowCtx = this.glow.getContext("2d");
    this.uiCtx = this.ui.getContext("2d");

    this.scale = 1;
    this.offsetX = 0;
    this.offsetY = 0;

    this.resize();
  }

  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.canvas.width = Math.floor(window.innerWidth * dpr);
    this.canvas.height = Math.floor(window.innerHeight * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    this.scale = Math.min(window.innerWidth / LOGICAL_W, window.innerHeight / LOGICAL_H);
    this.offsetX = (window.innerWidth - LOGICAL_W * this.scale) / 2;
    this.offsetY = (window.innerHeight - LOGICAL_H * this.scale) / 2;
  }

  begin() {
    this.sceneCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.glowCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.uiCtx.setTransform(1, 0, 0, 1, 0, 0);

    this.sceneCtx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
    this.glowCtx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
    this.uiCtx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

    return {
      scene: this.sceneCtx,
      glow: this.glowCtx,
      ui: this.uiCtx
    };
  }

  glowCircle(x, y, r, color, alpha = 0.35) {
    const c = this.glowCtx;
    c.save();
    c.globalAlpha = alpha;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, "transparent");
    c.fillStyle = g;
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  end() {
    const c = this.ctx;

    c.save();
    c.fillStyle = "#020302";
    c.fillRect(0, 0, window.innerWidth, window.innerHeight);

    c.translate(this.offsetX, this.offsetY);
    c.scale(this.scale, this.scale);

    // Glow pass
    c.save();
    c.globalAlpha = 0.55;
    c.filter = "blur(10px)";
    c.drawImage(this.glow, 0, 0);
    c.restore();

    // Main pass
    c.drawImage(this.scene, 0, 0);

    // Soft bloom from scene itself
    c.save();
    c.globalAlpha = 0.18;
    c.filter = "blur(5px)";
    c.drawImage(this.scene, -4, -4, LOGICAL_W + 8, LOGICAL_H + 8);
    c.restore();

    // UI pass
    c.drawImage(this.ui, 0, 0);

    // Vignette
    const v = c.createRadialGradient(
      LOGICAL_W * 0.5,
      LOGICAL_H * 0.45,
      LOGICAL_W * 0.12,
      LOGICAL_W * 0.5,
      LOGICAL_H * 0.45,
      LOGICAL_W * 0.75
    );
    v.addColorStop(0.58, "transparent");
    v.addColorStop(1, "rgba(0,0,0,0.48)");
    c.fillStyle = v;
    c.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    // Scanlines, subtle
    c.fillStyle = "rgba(255,255,255,0.022)";
    for (let y = 0; y < LOGICAL_H; y += 4) c.fillRect(0, y, LOGICAL_W, 1);

    c.restore();
  }

  toGame(clientX, clientY) {
    return {
      x: (clientX - this.offsetX) / this.scale,
      y: (clientY - this.offsetY) / this.scale
    };
  }
}

   Game
=========================== */

class Game {
  constructor() {
    this.engine = new RenderEngine(document.getElementById("game"));
    this.audio = new AudioEngine();

    this.state = GameState.MENU;
    this.buttons = [];

    this.playerName = loadLocal("mtr_player_name", "Примат");
    this.selectedSkin = loadLocal("mtr_skin", 0);
    this.records = loadLocal("mtr_records", []);
    this.unlockedLevel = loadLocal("mtr_unlocked", 1);

    this.levelIndex = 0;
    this.lastTime = 0;

    this.resetGameState();
    this.bindInput();

    requestAnimationFrame((t) => this.loop(t));
  }

  resetGameState() {
    this.player = {
      x: 250,
      y: GROUND_Y,
      vy: 0,
      onGround: true,
      doubleJump: true
    };

    this.progress = 0;
    this.score = 0;
    this.hp = 3;
    this.bananasCollected = 0;

    this.invincibleTimer = 0;
    this.dashTimer = 0;
    this.dashCooldown = 0;
    this.jumpBoostTimer = 0;
    this.armorTimer = 0;
    this.magnetTimer = 0;

    this.bannerText = "";
    this.bannerTimer = 0;
    this.storyStage = -1;

    this.cameraShake = 0;
    this.particles = [];

    this.generateLevel();
  }

  startLevel(index) {
    this.levelIndex = clamp(index, 0, LEVELS.length - 1);
    this.state = GameState.PLAYING;
    this.resetGameState();
  }

  bindInput() {
    window.addEventListener("resize", () => this.engine.resize());

    const handlePointer = (e) => {
      this.audio.resume();

      const p = e.touches ? e.touches[0] : e;
      const pos = this.engine.toGame(p.clientX, p.clientY);

      this.handleTap(pos.x, pos.y);

      if (e.cancelable) e.preventDefault();
    };

    this.engine.canvas.addEventListener("mousedown", handlePointer);
    this.engine.canvas.addEventListener("touchstart", handlePointer, { passive: false });

    window.addEventListener("keydown", (e) => {
      if (e.key === "p" || e.key === "Escape") {
        if (this.state === GameState.PLAYING) this.state = GameState.PAUSED;
        else if (this.state === GameState.PAUSED) this.state = GameState.PLAYING;
      }

      if (this.state === GameState.PLAYING) {
        if (e.key === " " || e.key === "ArrowUp") this.jump();
        if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") this.dash();
      }
    });
  }

  handleTap(x, y) {
    for (const b of this.buttons) {
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        b.action();
        return;
      }
    }

    if (this.state === GameState.PLAYING) {
      if (x < LOGICAL_W * 0.58) this.jump();
      else this.dash();
    }
  }

  generateLevel() {
    const level = LEVELS[this.levelIndex];
    const rand = seededRandom(1000 + this.levelIndex * 771);

    this.platforms = [];
    this.bananas = [];
    this.obstacles = [];
    this.bonuses = [];
    this.npcs = [];

    // Platforms
    for (let x = 620; x < level.length - 600; x += 620 + rand() * 300) {
      const y = GROUND_Y - (95 + rand() * 90);
      const w = 90 + rand() * 120;
      const type = Math.floor(rand() * 4);

      this.platforms.push({ x, y, w, type });

      if (rand() < 0.42) {
        this.platforms.push({
          x: x + w + 90 + rand() * 120,
          y: clamp(y + (rand() * 80 - 40), 330, 470),
          w: 80 + rand() * 110,
          type: Math.floor(rand() * 4)
        });
      }
    }

    // Ground bananas
    for (let x = 380; x < level.length - 500; x += 520 + rand() * 260) {
      const n = 4 + Math.floor(rand() * 4);
      const baseY = 520 - rand() * 30;

      for (let i = 0; i < n; i++) {
        this.bananas.push({
          x: x + i * 62,
          baseX: x + i * 62,
          y: baseY - Math.sin(i / Math.max(1, n - 1) * Math.PI) * 32,
          taken: false
        });
      }
    }

    // Platform bananas
    for (const p of this.platforms) {
      const n = 2 + Math.floor(rand() * 4);
      for (let i = 0; i < n; i++) {
        this.bananas.push({
          x: p.x + 20 + i * (p.w - 40) / Math.max(1, n - 1),
          baseX: p.x + 20 + i * (p.w - 40) / Math.max(1, n - 1),
          y: p.y - 34 - (i % 2) * 8,
          taken: false
        });
      }
    }

    // Obstacles
    let pool = [0, 1, 2, 6, 7, 8, 9];
    if (this.levelIndex > 0) pool.push(3);
    if (this.levelIndex > 3) pool.push(4, 5);

    for (let x = 900; x < level.length - 500; x += 720 + rand() * 360) {
      this.obstacles.push({
        x,
        y: GROUND_Y,
        type: pool[Math.floor(rand() * pool.length)],
        dead: false
      });

      if (rand() < 0.25 + level.theme * 0.04) {
        this.obstacles.push({
          x: x + 170 + rand() * 140,
          y: GROUND_Y,
          type: pool[Math.floor(rand() * pool.length)],
          dead: false
        });
      }
    }

    // Bonuses
    for (let x = 1600; x < level.length - 800; x += 1800 + rand() * 900) {
      this.bonuses.push({
        x,
        y: 390 + rand() * 100,
        type: Math.floor(rand() * 4),
        taken: false
      });
    }

    // NPC primates
    if (this.levelIndex >= 3) {
      for (let x = 2400; x < level.length - 1000; x += 2600 + rand() * 900) {
        this.npcs.push({
          anchor: x,
          range: 110 + rand() * 80,
          speed: 0.8 + rand() * 1.4,
          skin: Math.floor(rand() * 4),
          dead: false,
          t: rand() * 10
        });
      }
    }
  }

  worldToScreenX(worldX) {
    return this.player.x + (worldX - this.progress);
  }

  playerRect() {
    return {
      x: this.player.x - 24,
      y: this.player.y - 70,
      w: 48,
      h: 66
    };
  }

  obstacleRect(screenX, bottomY, type) {
    const data = OBSTACLE_TYPES[type] || OBSTACLE_TYPES[0];
    return {
      x: screenX - data.w / 2,
      y: bottomY - data.h,
      w: data.w,
      h: data.h
    };
  }

  jump() {
    const p = this.player;

    // Веб-версия: чуть выше и отзывчивее, чем предыдущая.
    if (p.onGround) {
      p.vy = -(this.jumpBoostTimer > 0 ? 640 : 555);
      p.onGround = false;
      p.doubleJump = true;
      this.audio.play("jump");
    } else if (p.doubleJump) {
      p.vy = -(this.jumpBoostTimer > 0 ? 560 : 475);
      p.doubleJump = false;
      this.audio.play("jump");
    }
  }

  dash() {
    if (this.dashCooldown <= 0) {
      this.dashTimer = 0.34;
      this.dashCooldown = this.dashBoostTimer > 0 ? 0.55 : 0.95;
      this.audio.play("dash");
      this.emit(this.player.x + 20, this.player.y - 30, "#fff06a", 20);
      this.cameraShake = Math.max(this.cameraShake, 0.08);
    }
  }

  activateBonus(type) {
    if (type === 0) this.jumpBoostTimer = 8;
    else if (type === 1) this.dashBoostTimer = 8;
    else if (type === 2) this.armorTimer = 8;
    else if (type === 3) this.magnetTimer = 8;
  }

  emit(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 80 + Math.random() * 280;
      this.particles.push({
        x,
        y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.5 + Math.random() * 0.55,
        size: 2 + Math.random() * 4,
        color
      });
    }
  }

  saveRecord() {
    let row = this.records.find(r => r.name === this.playerName);
    if (!row) {
      row = { name: this.playerName, score: 0, level: 0 };
      this.records.push(row);
    }

    row.score = Math.max(row.score, this.score);
    row.level = Math.max(row.level, this.levelIndex + 1);

    this.records.sort((a, b) => b.score - a.score);
    this.records = this.records.slice(0, 8);

    saveLocal("mtr_records", this.records);

    this.unlockedLevel = Math.max(this.unlockedLevel, this.levelIndex + 2);
    saveLocal("mtr_unlocked", this.unlockedLevel);
  }

  update(dt) {
    const level = LEVELS[this.levelIndex];

    this.audio.tickMusic();

    this.invincibleTimer -= dt;
    this.dashTimer -= dt;
    this.dashCooldown -= dt;
    this.jumpBoostTimer -= dt;
    this.dashBoostTimer -= dt;
    this.armorTimer -= dt;
    this.magnetTimer -= dt;
    this.bannerTimer -= dt;
    this.cameraShake -= dt;

    const speedMul = this.dashTimer > 0 ? (this.dashBoostTimer > 0 ? 2.2 : 1.9) : 1;
    this.progress += level.speed * speedMul * dt;

    const stage = Math.min(3, Math.floor(this.progress / level.length * 4));
    if (stage !== this.storyStage) {
      this.storyStage = stage;
      this.bannerText = STORY[level.theme][stage];
      this.bannerTimer = 2.8;
      this.audio.play("banner");
    }

    const p = this.player;
    const prevY = p.y;

    // Стабильнее: гравитация не зверская, прыжок читается лучше.
    const gravity = p.vy > 0 ? 1180 : 1450;
    p.vy += gravity * dt;
    p.y += p.vy * dt;
    p.onGround = false;

    for (const platform of this.platforms) {
      const sx = this.worldToScreenX(platform.x);
      if (
        p.x + 24 > sx &&
        p.x - 24 < sx + platform.w &&
        prevY <= platform.y &&
        p.y >= platform.y &&
        p.vy >= 0
      ) {
        p.y = platform.y;
        p.vy = 0;
        p.onGround = true;
        p.doubleJump = true;
      }
    }

    if (p.y > GROUND_Y) {
      p.y = GROUND_Y;
      p.vy = 0;
      p.onGround = true;
      p.doubleJump = true;
    }

    const pr = this.playerRect();

    // Bananas
    for (const b of this.bananas) {
      if (b.taken) continue;
      let sx = this.worldToScreenX(b.x);

      if (this.magnetTimer > 0 && Math.hypot(sx - p.x, b.y - (p.y - 40)) < 170) {
        const targetWorldX = this.progress + p.x;
        b.x += (targetWorldX - b.x) * 0.09;
        sx = this.worldToScreenX(b.x);
      }

      if (sx > -50 && sx < LOGICAL_W + 50 && rectsIntersect(pr, { x: sx - 18, y: b.y - 16, w: 36, h: 30 })) {
        b.taken = true;
        this.bananasCollected++;
        this.score += 15 + this.levelIndex;
        this.emit(sx, b.y, "#ffe75a", 10);
        this.audio.play("banana");
      }
    }

    // Bonuses
    for (const bonus of this.bonuses) {
      if (bonus.taken) continue;
      const sx = this.worldToScreenX(bonus.x);
      if (rectsIntersect(pr, { x: sx - 26, y: bonus.y - 26, w: 52, h: 52 })) {
        bonus.taken = true;
        this.activateBonus(bonus.type);
        this.emit(sx, bonus.y, "#b7ff8a", 24);
        this.audio.play("monkey");
      }
    }

    // NPCs
    for (const npc of this.npcs) {
      if (npc.dead) continue;

      npc.t += dt;
      const worldX = npc.anchor + Math.sin(npc.t * npc.speed + npc.skin * 1.7) * npc.range;
      const sx = this.worldToScreenX(worldX);
      const rr = { x: sx - 30, y: GROUND_Y - 78, w: 60, h: 78 };

      if (rectsIntersect(pr, rr)) {
        if (p.vy > 80 && pr.y + pr.h - 8 < rr.y + 18) {
          npc.dead = true;
          p.vy = -380;
          this.score += 40;
          if (Math.random() < 0.5) this.activateBonus(Math.floor(Math.random() * 4));
          else {
            this.bananasCollected += 2;
            this.score += 30;
          }
          this.emit(sx, GROUND_Y - 40, "#ffef70", 20);
          this.audio.play("monkey");
        } else if (this.invincibleTimer <= 0) {
          if (this.armorTimer > 0) {
            npc.dead = true;
            this.emit(sx, GROUND_Y - 40, "#9cff8a", 20);
            continue;
          }

          this.hp--;
          this.invincibleTimer = 1;
          this.cameraShake = 0.25;
          this.audio.play("hit");
          this.emit(sx, GROUND_Y - 40, "#ff6969", 24);

          if (this.hp <= 0) {
            this.reason = "Динамическое препятствие оказалось умнее примата.";
            this.saveRecord();
            this.state = GameState.GAME_OVER;
            return;
          }
        }
      }
    }

    // Static obstacles
    if (this.invincibleTimer <= 0) {
      for (const o of this.obstacles) {
        if (o.dead) continue;
        const sx = this.worldToScreenX(o.x);
        const rr = this.obstacleRect(sx, o.y, o.type);

        if (sx > -150 && sx < LOGICAL_W + 150 && rectsIntersect(pr, rr)) {
          if (this.armorTimer > 0) {
            o.dead = true;
            this.emit(sx, o.y - 40, "#9cff8a", 18);
            continue;
          }

          this.hp--;
          this.invincibleTimer = 1;
          this.cameraShake = 0.25;
          this.audio.play("hit");
          this.emit(sx, o.y - 40, "#ff6969", 22);

          if (this.hp <= 0) {
            this.reason = "Объект победил мартышку. Отчёт, конечно, всё равно успешный.";
            this.saveRecord();
            this.state = GameState.GAME_OVER;
            return;
          }

          break;
        }
      }
    }

    // Finish
    if (this.progress >= level.length) {
      if (this.bananasCollected >= level.target) {
        this.score += this.hp * 100;
        this.saveRecord();
        this.audio.play("clear");
        this.state = this.levelIndex === LEVELS.length - 1 ? GameState.FINISHED : GameState.LEVEL_CLEAR;
      } else {
        this.reason = "Бананов не хватило. Норма есть норма.";
        this.saveRecord();
        this.state = GameState.GAME_OVER;
      }
    }

    // Particles
    this.particles = this.particles.filter(p => (p.life -= dt) > 0);
    for (const particle of this.particles) {
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      particle.vy += 300 * dt;
    }
  }

  loop(ts) {
    const dt = Math.min(0.033, (ts - (this.lastTime || ts)) / 1000);
    this.lastTime = ts;

    if (this.state === GameState.PLAYING) this.update(dt);
    this.render(ts);

    requestAnimationFrame((t) => this.loop(t));
  }

  /* ===========================
     Drawing helpers
  =========================== */

  roundRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  fillRound(c, x, y, w, h, r, color) {
    c.fillStyle = color;
    this.roundRectPath(c, x, y, w, h, r);
    c.fill();
  }

  strokeRound(c, x, y, w, h, r, color, lw = 2) {
    c.strokeStyle = color;
    c.lineWidth = lw;
    this.roundRectPath(c, x, y, w, h, r);
    c.stroke();
  }

  text(c, value, x, y, size, color = "#fff", align = "center", bold = true) {
    c.save();
    c.font = `${bold ? "bold " : ""}${size}px monospace`;
    c.textAlign = align;
    c.textBaseline = "alphabetic";
    c.fillStyle = color;
    c.shadowColor = "rgba(0,0,0,0.85)";
    c.shadowBlur = 4;
    c.fillText(value, x, y);
    c.restore();
  }

  multilineText(c, value, x, y, size, color = "#fff", lineH = size * 1.25) {
    const lines = value.split("\n");
    const start = y - (lines.length - 1) * lineH * 0.5;
    for (let i = 0; i < lines.length; i++) {
      this.text(c, lines[i], x, start + i * lineH, size, color);
    }
  }

  button(c, x, y, w, h, label, action, opts = {}) {
    this.buttons.push({ x, y, w, h, action });

    const fill = opts.fill || "rgba(15,20,15,0.78)";
    const stroke = opts.stroke || "#8cff8c";
    const color = opts.color || "#e8ffe8";

    this.fillRound(c, x, y, w, h, 12, fill);
    this.strokeRound(c, x, y, w, h, 12, stroke, 2);
    this.text(c, label, x + w / 2, y + h / 2 + 7, 18, color);
  }

  /* ===========================
     Render
  =========================== */

  render(ts) {
    const layers = this.engine.begin();
    const c = layers.scene;
    const ui = layers.ui;

    this.buttons = [];

    if (this.cameraShake > 0) {
      const shake = this.cameraShake * 18;
      c.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake * 0.75);
    }

    this.drawBackground(c, ts);
    this.drawWorld(c);
    this.drawMonkey(c);
    this.drawParticles(c);
    this.drawWorldOverlay(c, ts);
    this.drawHUD(ui);

    if (this.state !== GameState.PLAYING) this.drawMenu(ui);

    this.engine.end();
  }

  drawBackground(c, ts) {
    const level = LEVELS[this.levelIndex];
    const theme = level.theme;

    const palettes = [
      ["#10202a", "#244c3a"],
      ["#1d1828", "#4f375d"],
      ["#181818", "#514c33"],
      ["#0d1816", "#275f4b"],
      ["#112027", "#4d6c55"],
      ["#15112d", "#2d5c78"],
      ["#06081d", "#24306c"],
      ["#160f0c", "#64432e"],
      ["#211414", "#683337"],
      ["#06100b", "#19643b"]
    ][theme];

    const bg = c.createLinearGradient(0, 0, 0, LOGICAL_H);
    bg.addColorStop(0, palettes[0]);
    bg.addColorStop(1, palettes[1]);
    c.fillStyle = bg;
    c.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    // Sun / mood light
    if (theme !== 6) {
      this.engine.glowCircle(1050, 95, 130, "#ffea99", 0.18);
      c.fillStyle = "rgba(255,245,170,0.12)";
      c.beginPath();
      c.arc(1050, 95, 56, 0, Math.PI * 2);
      c.fill();

      c.strokeStyle = "rgba(255,245,160,0.08)";
      c.lineWidth = 2;
      for (let i = -3; i <= 3; i++) {
        c.beginPath();
        c.moveTo(1050 + i * 24, 110);
        c.lineTo(1050 + i * 42, 420);
        c.stroke();
      }
    }

    if (theme === 6) {
      c.fillStyle = "rgba(255,255,255,0.9)";
      for (let i = 0; i < 85; i++) {
        const x = (i * 97 - this.progress * 0.06) % LOGICAL_W;
        const y = 30 + (i * 53 % 380);
        c.fillRect(x, y, 2, 2);
      }
    }

    this.drawClouds(c);
    this.drawDistantCity(c);
    this.drawThemeBackdrop(c, theme);
    this.drawBackdropPanels(c, theme);
    this.drawJokeBillboards(c, theme);

    // Ground
    c.fillStyle = "#161d15";
    c.fillRect(0, GROUND_Y, LOGICAL_W, LOGICAL_H - GROUND_Y);

    c.strokeStyle = "#63ff70";
    c.lineWidth = 4;
    c.beginPath();
    c.moveTo(0, GROUND_Y);
    c.lineTo(LOGICAL_W, GROUND_Y);
    c.stroke();

    // Ground texture
    c.fillStyle = "rgba(255,220,120,0.04)";
    for (let i = 0; i < 14; i++) {
      const x = (i * 112 + this.progress * 0.15) % LOGICAL_W;
      c.fillRect(x, GROUND_Y, 2, LOGICAL_H - GROUND_Y);
    }
  }

  drawClouds(c) {
    if (LEVELS[this.levelIndex].theme === 6) return;

    const cloud = (x, y, s) => {
      c.fillStyle = "rgba(255,255,255,0.18)";
      [[0, 0, 25], [30, -8, 25], [70, 0, 25]].forEach(p => {
        c.beginPath();
        c.arc(x + p[0] * s, y + p[1] * s, p[2] * s, 0, Math.PI * 2);
        c.fill();
      });
      c.fillRect(x - 5 * s, y, 85 * s, 26 * s);
    };

    cloud(180 - (this.progress * 0.02 % 1500), 110, 1);
    cloud(760 - (this.progress * 0.03 % 1500), 155, 1.2);
    cloud(1170 - (this.progress * 0.04 % 1500), 85, 1.35);
  }

  drawDistantCity(c) {
    const shift = (this.progress * 0.04) % 350;
    c.fillStyle = "rgba(25,35,45,0.35)";
    for (let i = -1; i < 8; i++) {
      const x = i * 190 - shift;
      const h = 80 + (i % 3) * 40;
      c.fillRect(x, 430 - h, 120, h);
    }
  }

  drawThemeBackdrop(c, theme) {
    if (theme === 0) {
      this.drawScaffold(c, 80, 390);
      this.drawScaffold(c, 760, 360);
      this.drawCrane(c);
      this.drawBrickWall(c, 420, 430, "ОТЧЁТ: ДОМ ИДЁТ");
    } else if (theme === 1) {
      c.fillStyle = "rgba(70,75,100,0.55)";
      c.fillRect(70, 250, 1140, 285);
      c.strokeStyle = "#9bdcff";
      c.lineWidth = 4;
      for (let r = 0; r < 3; r++) {
        for (let i = 0; i < 8; i++) {
          c.strokeRect(110 + i * 135, 285 + r * 75, 70, 55);
        }
      }
      this.drawLargeLabel(c, 640, 230, "ОКНА\nНАВЫВОРОТ");
    } else if (theme === 2) {
      c.fillStyle = "rgba(70,55,30,0.35)";
      c.fillRect(120, 260, 1040, 245);
      for (let i = 0; i < 5; i++) this.drawShelf(c, 160 + i * 210, 320 + (i % 2) * 55);
      this.drawLargeLabel(c, 645, 225, "КАБИНЕТ\nПЕЧАТЕЙ");
    } else if (theme === 3) {
      for (let i = 0; i < 5; i++) this.drawCar(c, 80 + i * 260 - (this.progress * 0.12 % 260), 530, i);
    } else if (theme === 4) {
      for (let i = 0; i < 6; i++) this.drawChickenBg(c, 120 + i * 190 - (this.progress * 0.06 % 180), 525);
    } else if (theme === 5) {
      for (let i = 0; i < 4; i++) this.drawPeacockBg(c, 180 + i * 280, 530, 1);
    } else if (theme === 7) {
      for (let i = 0; i < 7; i++) {
        c.fillStyle = "rgba(130,90,50,0.7)";
        c.fillRect(70 + i * 190 - (this.progress * 0.07 % 190), 465, 90, 70);
      }
    } else if (theme === 8) {
      c.fillStyle = "rgba(180,180,180,0.08)";
      for (let i = 0; i < 12; i++) c.fillRect(90 + i * 90, 260 + (i % 3) * 20, 60, 180);
      this.drawLargeLabel(c, 640, 220, "ПЛАНЁРКА\nПРИМАТОВ");
    } else if (theme === 9) {
      c.fillStyle = "rgba(100,70,45,0.45)";
      c.fillRect(120, 360, 320, 180);
      c.fillRect(470, 320, 380, 220);
      c.fillRect(880, 390, 250, 150);
      c.strokeStyle = "rgba(170,255,140,0.4)";
      c.strokeRect(120, 360, 320, 180);
      c.strokeRect(470, 320, 380, 220);
      c.strokeRect(880, 390, 250, 150);
    }
  }

  drawBackdropPanels(c, theme) {
    const labels = [
      ["СМЕТА ЖИВА", "БРИГАДА В ПУТИ", "КАСКА + БАНАН"],
      ["СТЕКЛО В ДОРОГЕ", "РАМА МЕЧТЫ", "МОНТАЖ ПО ЧУЙКЕ"],
      ["ОТЧЁТ 2/8", "ПЕЧАТЬ ГОТОВА", "АРХИВ ДЫМИТСЯ"],
      ["МЕСТ НЕТ", "ПАРКУЙСЯ С ДУШОЙ", "ЕЩЁ ВЛЕЗЕТ"],
      ["КУРЫ ДОПУЩЕНЫ", "ЛЕКЦИЯ ИДЁТ", "ПЕРЕРЫВ НА ЗЁРНА"],
      ["ПАВЛИН ОДОБРИЛ", "ИНСПЕКЦИЯ ХВОСТА", "НЕ БОЯТЬСЯ"],
      ["СТАРТ ДАН", "ОРБИТА НОРМ", "БАНАНЫ НА БОРТУ"],
      ["СКЛАД ЖИВ", "220V РЯДОМ", "ПРОВОДКА СМОТРИТ"],
      ["ПЛАН ЕСТЬ", "ГРАФИК ДЫМИТСЯ", "СОВЕЩАНИЕ ЖИВО"],
      ["ДОМ ИДЁТ", "КОРОВНИК МАЯЧИТ", "ПРИМАТ РАБОТАЕТ"]
    ][theme];

    const baseY = 400;
    for (let i = 0; i < 3; i++) {
      let x = (LOGICAL_W * (0.14 + i * 0.31) - this.progress * (0.055 + i * 0.012)) % (LOGICAL_W + 500);
      if (x < -120) x += LOGICAL_W + 500;

      const w = theme === 0 ? 170 : 145;
      const h = 64 + (i % 2) * 14;

      this.fillRound(c, x - w / 2, baseY - h / 2, w, h, 8, "rgba(15,20,18,0.55)");
      this.strokeRound(c, x - w / 2, baseY - h / 2, w, h, 8, "rgba(160,240,170,0.38)", 1.6);
      this.text(c, labels[i], x, baseY + 6, 14, "#dcffdc");
    }
  }

  drawJokeBillboards(c, theme) {
    const packs = [
      ["КАСКА ЕСТЬ / ПЛАНА НЕТ", "КИРПИЧ С ДУШОЙ", "ОБЪЕКТ ПОЧТИ ГОТОВ"],
      ["ОКНО ПРИЕХАЛО", "РАМА КРИВАЯ", "СТЕКЛО ЖИВО"],
      ["ОТЧЁТ ГОТОВ", "ПЕЧАТЬ ЕСТ", "АРХИВ НЕ СПИТ"],
      ["МЕСТ НЕТ", "Я НА МИНУТКУ", "ПРИМИТЕ ФАКТ"],
      ["КО-КО ДОПУСК", "ЗЁРНА ВПЕРЁД", "ЛЕКЦИЯ ИДЁТ"],
      ["ПАВЛИН СМОТРИТ", "НЕ НЕРВНИЧАТЬ", "ИНСПЕКТОР РЯДОМ"],
      ["КОСМОС ЕСТЬ", "БАНАНЫ ЛЕТЯТ", "ОРБИТА НОРМ"],
      ["220V И ВЕРА", "СКЛАД ЖИВ", "ПРОВОДКА ДЫШИТ"],
      ["ПЛАН ВЫДАН", "СОВЕЩАНИЕ ИДЁТ", "2+2 ПРИМЕРНО"],
      ["ДОМ ВОЗМОЖЕН", "ФЕРМА МАЯЧИТ", "СРОКИ ЕСТЬ"]
    ][theme];

    for (let i = 0; i < 3; i++) {
      const x = 180 + i * 420 - (this.progress * (0.11 + i * 0.02) % (LOGICAL_W + 400));
      this.drawFloatingSign(c, x, 260 + (i % 2) * 40, packs[i]);
    }
  }

  drawFloatingSign(c, x, y, label) {
    this.fillRound(c, x - 95, y, 190, 48, 8, "rgba(0,0,0,0.55)");
    this.strokeRound(c, x - 95, y, 190, 48, 8, "#eade71", 1.8);
    this.text(c, label, x, y + 29, 14, "#fff18a");
  }

  drawCrane(c) {
    c.strokeStyle = "rgba(210,170,70,0.75)";
    c.lineWidth = 5;
    c.beginPath();
    c.moveTo(950, 210);
    c.lineTo(950, 520);
    c.moveTo(770, 230);
    c.lineTo(1150, 230);
    c.stroke();
    this.drawSmallLabel(c, 1080, 245, "КРАН\nДУМАЕТ");
  }

  drawScaffold(c, x, y) {
    c.strokeStyle = "rgba(130,255,150,0.48)";
    c.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      c.strokeRect(x + i * 55, y - 120, 48, 120);
      c.beginPath();
      c.moveTo(x + i * 55, y - 120);
      c.lineTo(x + i * 55 + 48, y);
      c.moveTo(x + i * 55 + 48, y - 120);
      c.lineTo(x + i * 55, y);
      c.stroke();
    }
    c.fillStyle = "#7a5732";
    c.fillRect(x - 10, y - 65, 250, 12);
  }

  drawBrickWall(c, x, y, label) {
    c.fillStyle = "rgba(130,80,50,0.55)";
    c.fillRect(x, y, 230, 100);
    this.drawSmallLabel(c, x + 115, y - 20, label);
  }

  drawShelf(c, x, y) {
    c.strokeStyle = "rgba(180,160,90,0.35)";
    c.strokeRect(x, y, 170, 15);
    c.strokeRect(x, y + 40, 170, 15);
    c.strokeRect(x, y + 80, 170, 15);
  }

  drawCar(c, x, y, i) {
    c.fillStyle = ["#3297d3", "#d34e32", "#6abc70"][i % 3];
    this.fillRound(c, x, y, 120, 42, 14, c.fillStyle);
    c.fillStyle = "#111";
    c.beginPath();
    c.arc(x + 25, y + 42, 12, 0, Math.PI * 2);
    c.arc(x + 95, y + 42, 12, 0, Math.PI * 2);
    c.fill();
  }

  drawChickenBg(c, x, y) {
    c.fillStyle = "#fff8e8";
    c.beginPath();
    c.ellipse(x, y, 24, 16, 0, 0, Math.PI * 2);
    c.arc(x + 22, y - 16, 10, 0, Math.PI * 2);
    c.fill();
  }

  drawPeacockBg(c, x, y, k) {
    c.strokeStyle = "#38d99d";
    c.lineWidth = 4 * k;
    for (let i = -3; i <= 3; i++) {
      c.beginPath();
      c.moveTo(x + 22 * k, y - 20 * k);
      c.lineTo(x + (22 + i * 18) * k, y - (70 - Math.abs(i) * 5) * k);
      c.stroke();
    }
    c.fillStyle = "#2466d8";
    c.beginPath();
    c.ellipse(x + 22 * k, y - 18 * k, 16 * k, 26 * k, 0, 0, Math.PI * 2);
    c.fill();
  }

  drawLargeLabel(c, x, y, label) {
    const lines = label.split("\n");
    const w = 220;
    const h = 36 + lines.length * 18;

    this.fillRound(c, x - w / 2, y - h / 2, w, h, 10, "rgba(0,0,0,0.55)");
    this.strokeRound(c, x - w / 2, y - h / 2, w, h, 10, "rgba(120,255,120,0.65)", 1.8);

    lines.forEach((line, i) => {
      this.text(c, line, x, y + (i - lines.length / 2 + 0.75) * 20, 18, "#9cff9c");
    });
  }

  drawSmallLabel(c, x, y, label) {
    const lines = label.split("\n");
    const w = Math.max(78, ...lines.map(v => v.length * 10));
    const h = 22 + lines.length * 14;

    this.fillRound(c, x - w / 2, y - h / 2, w, h, 7, "rgba(0,0,0,0.68)");
    this.strokeRound(c, x - w / 2, y - h / 2, w, h, 7, "#8cff8c", 1.5);

    lines.forEach((line, i) => {
      this.text(c, line, x, y + (i - lines.length / 2 + 0.8) * 14, 12, "#aaffaa");
    });
  }

  drawWorld(c) {
    for (const p of this.platforms) {
      const sx = this.worldToScreenX(p.x);
      if (sx + p.w > -100 && sx < LOGICAL_W + 100) this.drawPlatform(c, sx, p);
    }

    for (const b of this.bananas) {
      if (b.taken) continue;
      const sx = this.worldToScreenX(b.x);
      if (sx > -50 && sx < LOGICAL_W + 50) this.drawBanana(c, sx, b.y);
    }

    for (const bo of this.bonuses) {
      if (bo.taken) continue;
      const sx = this.worldToScreenX(bo.x);
      if (sx > -70 && sx < LOGICAL_W + 70) this.drawBonus(c, sx, bo.y, bo.type);
    }

    for (const o of this.obstacles) {
      if (o.dead) continue;
      const sx = this.worldToScreenX(o.x);
      if (sx > -150 && sx < LOGICAL_W + 150) this.drawObstacle(c, sx, o.type, o.y);
    }

    for (const npc of this.npcs) {
      if (npc.dead) continue;
      const wx = npc.anchor + Math.sin(npc.t * npc.speed + npc.skin * 1.7) * npc.range;
      const sx = this.worldToScreenX(wx);
      if (sx > -120 && sx < LOGICAL_W + 120) this.drawNpcPrimate(c, sx, npc.skin);
    }

    const finishX = this.worldToScreenX(LEVELS[this.levelIndex].length);
    if (finishX > -50 && finishX < LOGICAL_W + 300) this.drawFinish(c, finishX);
  }

  drawPlatform(c, sx, p) {
    c.strokeStyle = "rgba(90,255,120,0.6)";
    c.lineWidth = 3;

    for (let support = sx + 18; support < sx + p.w; support += Math.max(60, p.w / 3)) {
      c.beginPath();
      c.moveTo(support, p.y);
      c.lineTo(support, GROUND_Y);
      c.moveTo(support - 16, p.y + 20);
      c.lineTo(support + 16, GROUND_Y - 5);
      c.moveTo(support + 16, p.y + 20);
      c.lineTo(support - 16, GROUND_Y - 5);
      c.stroke();
    }

    let fill = "#745733";
    if (p.type === 1) fill = "#78889a";
    if (p.type === 2) fill = "#b9a346";
    if (p.type === 3) fill = "#806044";

    this.fillRound(c, sx, p.y - 8, p.w, 14, 5, fill);

    if (p.type === 2) {
      c.strokeStyle = "rgba(40,40,40,0.7)";
      c.lineWidth = 3;
      for (let x = sx + 10; x < sx + p.w; x += 22) {
        c.beginPath();
        c.moveTo(x, p.y + 7);
        c.lineTo(x + 12, p.y - 7);
        c.stroke();
      }
    }
  }

  /*
    Новый банан:
    не лимон, не таблетка, не скобка.
    Это именно слегка изогнутый банан, похожий на Android-версию,
    но с заливкой и бликом.
  */
  drawBanana(c, x, y) {
    c.save();

    c.translate(x, y);
    c.rotate(-0.18);

    const path = new Path2D();
    path.moveTo(-28, 5);
    path.bezierCurveTo(-20, -24, 18, -25, 34, -8);
    path.bezierCurveTo(24, 8, 0, 22, -22, 16);
    path.bezierCurveTo(-28, 14, -31, 10, -28, 5);

    c.fillStyle = "#ffd93a";
    c.fill(path);

    c.strokeStyle = "#9b6a12";
    c.lineWidth = 3;
    c.stroke(path);

    const inner = new Path2D();
    inner.moveTo(-16, 3);
    inner.bezierCurveTo(-7, -11, 17, -13, 25, -5);
    inner.bezierCurveTo(14, 5, 1, 11, -12, 9);
    inner.bezierCurveTo(-18, 8, -20, 6, -16, 3);

    c.fillStyle = "rgba(255,245,150,0.75)";
    c.fill(inner);

    c.fillStyle = "#7d4f0e";
    c.beginPath();
    c.ellipse(-28, 7, 4, 3, 0.3, 0, Math.PI * 2);
    c.fill();

    c.beginPath();
    c.ellipse(31, -6, 4, 3, -0.3, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = "rgba(255,255,220,0.65)";
    c.beginPath();
    c.arc(-7, -8, 2.5, 0, Math.PI * 2);
    c.fill();

    c.restore();

    this.engine.glowCircle(x, y, 30, "#ffe14a", 0.18);
  }

  drawBonus(c, x, y, type) {
    const b = BONUS_TYPES[type];

    c.fillStyle = b.color + "99";
    c.beginPath();
    c.arc(x, y, 28, 0, Math.PI * 2);
    c.fill();

    c.strokeStyle = "#fff";
    c.lineWidth = 2;
    c.stroke();

    this.text(c, b.label, x, y + 5, 12, "#fff");
    this.engine.glowCircle(x, y, 38, b.color, 0.22);
  }

  drawObstacle(c, x, type, bottomY) {
    switch (type) {
      case 0: this.drawBrickStack(c, x, bottomY); break;
      case 1: this.drawPaperTower(c, x, bottomY); break;
      case 2: this.drawCrookedWindow(c, x, bottomY); break;
      case 3: this.drawBadParking(c, x, bottomY); break;
      case 4: this.drawChicken(c, x, bottomY); break;
      case 5: this.drawPeacock(c, x, bottomY); break;
      case 6: this.drawCone(c, x, bottomY); break;
      case 7: this.drawWetWire(c, x, bottomY); break;
      case 8: this.drawPaintBucket(c, x, bottomY); break;
      case 9: this.drawLooseBeam(c, x, bottomY); break;
    }
  }

  drawBrickStack(c, x, b) {
    const base = b - 3;
    c.fillStyle = "#96412d";

    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 2 + (row % 2); col++) {
        const bx = x - 34 + col * 27 + (row % 2) * 8;
        const by = base - (row + 1) * 15;
        this.fillRound(c, bx, by, 24, 12, 2, "#a84e35");
      }
    }

    this.drawSmallLabel(c, x, base - 83, "КИРПИЧ\nС ДУШОЙ");
  }

  drawPaperTower(c, x, b) {
    const base = b - 3;

    for (let i = 0; i < 6; i++) {
      c.fillStyle = i % 2 === 0 ? "#e6f0dc" : "#c8dccd";
      c.fillRect(x - 25 + (i % 2) * 3.5, base - (i + 1) * 14.5, 48, 14.5);
      c.strokeStyle = "#3c503c";
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(x - 20, base - (i + 0.5) * 14.5);
      c.lineTo(x + 18, base - (i + 0.5) * 14.5);
      c.stroke();
    }

    this.drawSmallLabel(c, x, base - 100, "ОТЧЁТ");
  }

  drawCrookedWindow(c, x, b) {
    const base = b - 10;

    c.save();
    c.translate(x, base - 40);
    c.rotate(-12 * Math.PI / 180);

    c.strokeStyle = "#a0d2ff";
    c.lineWidth = 5;
    c.strokeRect(-35, -30, 70, 60);

    c.beginPath();
    c.moveTo(0, -30);
    c.lineTo(0, 30);
    c.moveTo(-35, 0);
    c.lineTo(35, 0);
    c.stroke();

    c.restore();

    this.drawSmallLabel(c, x, base - 90, "ОКНО\nВ БОК");
  }

  drawBadParking(c, x, b) {
    const base = b - 4;

    c.save();
    c.translate(x, base - 25);
    c.rotate(-8 * Math.PI / 180);

    this.fillRound(c, -68, -48, 140, 36, 10, "#3296dc");
    this.fillRound(c, -32, -62, 64, 28, 8, "#5fbeff");

    c.fillStyle = "#191919";
    c.beginPath();
    c.arc(-48, -10, 11, 0, Math.PI * 2);
    c.arc(48, -10, 11, 0, Math.PI * 2);
    c.fill();

    c.restore();

    this.drawSmallLabel(c, x, base - 80, "Я НА\nМИНУТКУ");
  }

  drawChicken(c, x, b) {
    const base = b - 2;

    c.fillStyle = "#f5f5e6";
    c.beginPath();
    c.ellipse(x, base - 25, 21, 16, 0, 0, Math.PI * 2);
    c.arc(x + 17, base - 41, 13, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = "#e62323";
    c.beginPath();
    c.arc(x + 14, base - 52, 4.5, 0, Math.PI * 2);
    c.arc(x + 20, base - 51, 4.5, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = "#ffaf28";
    c.beginPath();
    c.moveTo(x + 28, base - 41);
    c.lineTo(x + 40, base - 36);
    c.lineTo(x + 28, base - 33);
    c.closePath();
    c.fill();

    c.fillStyle = "#322314";
    c.beginPath();
    c.arc(x + 21, base - 45, 1.8, 0, Math.PI * 2);
    c.fill();

    c.strokeStyle = "#322314";
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(x - 9, base - 6);
    c.lineTo(x - 12, base);
    c.moveTo(x + 9, base - 6);
    c.lineTo(x + 12, base);
    c.stroke();

    this.drawSmallLabel(c, x, base - 64, "КО-КО");
  }

  drawPeacock(c, x, b) {
    const base = b - 3;
    const colors = ["#23c8a0", "#286ee6", "#8c50d2", "#1eaa5a"];

    c.lineWidth = 6;
    for (let i = -3; i <= 3; i++) {
      c.strokeStyle = colors[Math.abs(i) % colors.length];
      c.beginPath();
      c.moveTo(x, base - 37);
      c.lineTo(x + i * 17, base - (90 - Math.abs(i) * 5));
      c.stroke();

      c.beginPath();
      c.arc(x + i * 17, base - (90 - Math.abs(i) * 5), 5.5, 0, Math.PI * 2);
      c.stroke();
    }

    c.fillStyle = "#1e5fdc";
    c.beginPath();
    c.ellipse(x, base - 29, 15, 22, 0, 0, Math.PI * 2);
    c.arc(x + 6, base - 48, 9.5, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = "#ffd22d";
    c.beginPath();
    c.moveTo(x + 15, base - 48);
    c.lineTo(x + 27, base - 44);
    c.lineTo(x + 15, base - 41);
    c.closePath();
    c.fill();

    this.drawSmallLabel(c, x, base - 110, "НЕ\nБОЯТЬСЯ");
  }

  drawCone(c, x, b) {
    const base = b - 2;

    c.fillStyle = "#f56e19";
    c.beginPath();
    c.moveTo(x, base - 60);
    c.lineTo(x - 31, base);
    c.lineTo(x + 31, base);
    c.closePath();
    c.fill();

    c.fillStyle = "#f5f5f5";
    c.fillRect(x - 13, base - 34, 26, 8);

    c.fillStyle = "#707070";
    c.fillRect(x - 40, base, 80, 6);

    this.drawSmallLabel(c, x, base - 75, "ДОРОГА\nЗАКРЫТА");
  }

  drawWetWire(c, x, b) {
    const base = b - 4;

    c.fillStyle = "rgba(50,160,210,0.7)";
    c.beginPath();
    c.ellipse(x, base - 8, 54, 12, 0, 0, Math.PI * 2);
    c.fill();

    c.strokeStyle = "#ffeb50";
    c.lineWidth = 3.5;
    c.beginPath();
    c.moveTo(x - 45, base - 28);
    c.bezierCurveTo(x - 20, base - 50, x + 12, base - 8, x + 48, base - 32);
    c.stroke();

    this.drawSmallLabel(c, x, base - 63, "220V\nИ ВЕРА");
  }

  drawPaintBucket(c, x, b) {
    const base = b - 3;

    this.fillRound(c, x - 32, base - 45, 64, 41, 6, "#5078a0");

    c.fillStyle = "#fff56e";
    c.beginPath();
    c.ellipse(x, base - 45, 32, 7, 0, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = "rgba(255,245,110,0.68)";
    c.beginPath();
    c.ellipse(x + 32, base - 5, 20, 10, 0, 0, Math.PI * 2);
    c.fill();

    this.drawSmallLabel(c, x, base - 70, "КРАСКА\nС ДУШОЙ");
  }

  drawLooseBeam(c, x, b) {
    const base = b - 5;

    c.save();
    c.translate(x, base - 20);
    c.rotate(10 * Math.PI / 180);

    this.fillRound(c, -70, -20, 140, 16, 4, "#78502a");

    c.fillStyle = "#aa7841";
    c.fillRect(-63, -16, 126, 3);

    c.restore();

    this.drawSmallLabel(c, x, base - 70, "БАЛКА\nСЮРПРИЗ");
  }

  drawNpcPrimate(c, x, skinIndex) {
    const sk = SKINS[skinIndex];
    const base = GROUND_Y - 3;

    c.fillStyle = sk.fur;
    c.beginPath();
    c.ellipse(x, base - 43, 23, 19, 0, 0, Math.PI * 2);
    c.arc(x, base - 52, 18, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = sk.face;
    c.beginPath();
    c.ellipse(x, base - 53, 10, 6.5, 0, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = "#141414";
    c.beginPath();
    c.arc(x - 4.5, base - 52.5, 1.6, 0, Math.PI * 2);
    c.arc(x + 4.5, base - 52.5, 1.6, 0, Math.PI * 2);
    c.fill();

    c.strokeStyle = sk.accent;
    c.lineWidth = 2.2;
    c.beginPath();
    c.moveTo(x - 20, base - 20);
    c.lineTo(x - 32, base - 5);
    c.moveTo(x + 20, base - 20);
    c.lineTo(x + 32, base - 5);
    c.stroke();
  }

  drawFinish(c, x) {
    c.fillStyle = "#c0c0c0";
    c.fillRect(x, 420, 6, 140);

    const s = 20;
    for (let r = 0; r < 5; r++) {
      for (let k = 0; k < 4; k++) {
        c.fillStyle = (r + k) % 2 ? "#000" : "#fff";
        c.fillRect(x + 6 + k * s, 420 + r * s, s, s);
      }
    }

    this.text(c, "ФИНИШ", x + 50, 400, 22, "#8cff8c");
  }

  drawMonkey(c) {
    const p = this.player;
    const blink = this.invincibleTimer > 0 ? Math.sin(this.invincibleTimer * 40) : 1;
    if (this.invincibleTimer > 0 && blink < 0) return;

    const cx = p.x;
    const bottom = p.y;
    const sk = SKINS[this.selectedSkin];

    // Rainbow trail behind the monkey, like Android version
    const colors = ["#ff3246", "#ff9128", "#ffe637", "#50eb5a", "#46aaff", "#af5aff"];
    const trailTop = bottom - 50;
    const trailLen = Math.min(LOGICAL_W * 0.28, 180);

    for (let i = 0; i < colors.length; i++) {
      c.fillStyle = colors[i];
      c.globalAlpha = this.invincibleTimer > 0 ? 0.58 : 0.78;
      this.fillRound(c, cx - 24 - trailLen, trailTop + i * 7.8, trailLen, 6.6, 3, colors[i]);
    }
    c.globalAlpha = 1;

    // Tail
    c.strokeStyle = sk.fur;
    c.lineWidth = 5;
    c.beginPath();
    c.arc(cx - 62, bottom - 44, 44, 0.25, 5.2);
    c.stroke();

    // Body
    c.fillStyle = sk.fur;
    c.beginPath();
    c.ellipse(cx, bottom - 38, 29, 26, 0, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = sk.face;
    c.beginPath();
    c.ellipse(cx, bottom - 33, 15, 11, 0, 0, Math.PI * 2);
    c.fill();

    // Head and ears
    c.fillStyle = sk.fur;
    c.beginPath();
    c.arc(cx - 27, bottom - 62, 11, 0, Math.PI * 2);
    c.arc(cx + 27, bottom - 62, 11, 0, Math.PI * 2);
    c.arc(cx, bottom - 62, 22.5, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = sk.face;
    c.beginPath();
    c.ellipse(cx, bottom - 57, 15.5, 9, 0, 0, Math.PI * 2);
    c.fill();

    // Face
    c.fillStyle = "#1e1912";
    c.beginPath();
    c.arc(cx - 7, bottom - 63, 2.2, 0, Math.PI * 2);
    c.arc(cx + 7, bottom - 63, 2.2, 0, Math.PI * 2);
    c.fill();

    c.strokeStyle = "#1e1912";
    c.lineWidth = 1.8;
    c.beginPath();
    c.arc(cx, bottom - 56, 7, 0.45, 2.68);
    c.stroke();

    // Helmet
    this.fillRound(c, cx - 22, bottom - 90, 44, 12, 6, sk.helmet);
    c.fillStyle = "#231e14";
    c.fillRect(cx - 20, bottom - 82.5, 40, 5.5);

    // Arms / legs
    c.strokeStyle = sk.accent;
    c.lineWidth = 4.2;
    c.beginPath();

    // legs
    c.moveTo(cx - 18, bottom - 20);
    c.lineTo(cx - 30, bottom + 1);
    c.moveTo(cx + 18, bottom - 20);
    c.lineTo(cx + 30, bottom + 1);

    // arms
    c.moveTo(cx - 22, bottom - 40);
    c.lineTo(cx - 44, bottom - 32);
    c.moveTo(cx + 22, bottom - 40);
    c.lineTo(cx + 42, bottom - 49);

    c.stroke();

    if (this.dashTimer > 0) {
      this.text(c, "РЫВОК!", cx, bottom - 114, 20, "#fff05a");
    }

    this.engine.glowCircle(cx, bottom - 55, 45, "#ffe890", 0.12);
  }

  drawParticles(c) {
    for (const p of this.particles) {
      const a = clamp(p.life / 0.9, 0, 1);
      c.globalAlpha = a;
      c.fillStyle = p.color;
      c.beginPath();
      c.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      c.fill();

      c.globalAlpha = a * 0.45;
      c.strokeStyle = p.color;
      c.lineWidth = Math.max(1, p.size * 0.6);
      c.beginPath();
      c.moveTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
      c.lineTo(p.x, p.y);
      c.stroke();
    }
    c.globalAlpha = 1;
  }

  drawWorldOverlay(c, ts) {
    // Haze
    const haze = c.createLinearGradient(0, 0, 0, LOGICAL_H);
    haze.addColorStop(0, "rgba(255,255,255,0)");
    haze.addColorStop(1, "rgba(255,220,120,0.08)");
    c.fillStyle = haze;
    c.fillRect(0, LOGICAL_H * 0.5, LOGICAL_W, LOGICAL_H * 0.5);

    // Dust
    for (let i = 0; i < 24; i++) {
      const px = (i * 97 / 8 + ts * 0.012 * (12 + (i % 5) * 3)) % (LOGICAL_W + 60) - 20;
      const py = (LOGICAL_H * (0.15 + (i % 9) * 0.07) + Math.sin(ts * 0.0007 + i) * 14);
      c.fillStyle = `rgba(255,250,220,${0.07 + (i % 4) * 0.03})`;
      c.beginPath();
      c.arc(px, py, 0.9 + (i % 3) * 0.6, 0, Math.PI * 2);
      c.fill();
    }

    // Story banner
    if (this.bannerTimer > 0 && !(this.bannerTimer < 0.6 && Math.floor(this.bannerTimer * 12) % 2 === 0)) {
      this.fillRound(c, 350, 105, 580, 55, 12, "rgba(0,0,0,0.72)");
      this.strokeRound(c, 350, 105, 580, 55, 12, "#fff08a", 3);
      this.text(c, this.bannerText, 640, 140, 22, "#fff08a");
    }
  }

  drawHUD(c) {
    if (this.state !== GameState.PLAYING) return;

    const level = LEVELS[this.levelIndex];

    this.fillRound(c, 12, 12, 1256, 72, 12, "rgba(0,0,0,0.55)");
    this.text(c, level.name, 28, 40, 20, "#8cff8c", "left");
    this.text(c, level.subtitle, 28, 65, 14, "#d7ffd7", "left", false);

    const percent = Math.min(100, Math.floor(this.progress / level.length * 100));
    const hud = `${this.playerName}    BAN ${this.bananasCollected}/${level.target}    HP ${this.hp}    SCORE ${this.score}    ${percent}%`;
    this.text(c, hud, 1250, 45, 18, "#fff08a", "right");

    const barW = LOGICAL_W * 0.26;
    const barH = 8;
    const bx = LOGICAL_W - 24 - barW;
    const by = 56;

    this.fillRound(c, bx, by, barW, barH, barH / 2, "rgba(255,255,255,0.3)");
    this.fillRound(c, bx, by, barW * Math.min(1, this.progress / level.length), barH, barH / 2, "#64ff78");

    let status = "";
    if (this.jumpBoostTimer > 0) status += ` JUMP+ ${Math.ceil(this.jumpBoostTimer)}s`;
    if (this.dashBoostTimer > 0) status += ` DASH+ ${Math.ceil(this.dashBoostTimer)}s`;
    if (this.armorTimer > 0) status += ` ARMOR ${Math.ceil(this.armorTimer)}s`;
    if (this.magnetTimer > 0) status += ` MAGNET ${Math.ceil(this.magnetTimer)}s`;
    if (status) this.text(c, status, 28, 92, 14, "#fff08a", "left");

    this.button(c, 1130, 95, 120, 42, "ПАУЗА", () => {
      this.state = GameState.PAUSED;
    }, {
      stroke: "#fff08a",
      fill: "rgba(0,0,0,0.55)",
      color: "#fff08a"
    });

    this.button(c, 45, 615, 470, 72, "ПРЫЖОК / ПЛАНИРОВАНИЕ", () => this.jump(), {
      stroke: "rgba(120,255,120,0.5)",
      fill: "rgba(60,120,60,0.18)",
      color: "rgba(200,255,200,0.95)"
    });

    this.button(c, 820, 615, 410, 72, this.dashCooldown <= 0 ? "РЫВОК" : `РЫВОК: ${this.dashCooldown.toFixed(1)}`, () => this.dash(), {
      stroke: "rgba(255,235,90,0.5)",
      fill: "rgba(90,90,40,0.18)",
      color: "rgba(255,235,90,0.95)"
    });
  }

  drawMenu(c) {
    this.fillRound(c, 0, 0, LOGICAL_W, LOGICAL_H, 0, "rgba(0,0,0,0.76)");

    if (this.state === GameState.MENU) {
      this.text(c, "ГЛАВНОЕ МЕНЮ", 640, 180, 42, "#8cff8c");
      this.text(c, "Web-порт Android-версии: новый рендер, эффекты, скины и нормальные бананы.", 640, 235, 18, "#fff", "center", false);

      this.button(c, 430, 285, 420, 56, "ВПЕРЁД, ПРИМАТЫ!", () => {
        this.playerName = (prompt("Имя примата:", this.playerName) || this.playerName).slice(0, 24) || "Безымянный примат";
        saveLocal("mtr_player_name", this.playerName);
        this.startLevel(0);
      });

      this.button(c, 430, 355, 420, 52, "ВЫБЕРИ СВОЕГО ПРИМАТА", () => this.state = GameState.SKINS);
      this.button(c, 430, 420, 420, 52, "МАРТЫШКИНЫ РЕКОРДЫ", () => this.state = GameState.RECORDS);
      this.button(c, 430, 485, 420, 52, "ВЫБОР УРОВНЯ", () => this.state = GameState.LEVEL_SELECT);
      this.button(c, 430, 550, 420, 52, "ЗВУК", () => this.state = GameState.SETTINGS);
    }

    else if (this.state === GameState.PAUSED) {
      this.text(c, "ПАУЗА", 640, 220, 42, "#8cff8c");
      this.button(c, 430, 330, 420, 56, "ПРОДОЛЖИТЬ", () => this.state = GameState.PLAYING);
      this.button(c, 430, 400, 420, 56, "В МЕНЮ", () => this.state = GameState.MENU);
    }

    else if (this.state === GameState.LEVEL_CLEAR) {
      this.text(c, "УРОВЕНЬ ПРОЙДЕН", 640, 220, 42, "#8cff8c");
      this.text(c, "Мартышка выжила. Объект всё ещё сомнительный, но бананы уже в кармане.", 640, 350, 20, "#fff", "center", false);
      this.button(c, 430, 430, 420, 56, "СЛЕДУЮЩИЙ", () => this.startLevel(this.levelIndex + 1));
    }

    else if (this.state === GameState.GAME_OVER) {
      this.text(c, "МАРТЫШКА УПАЛА", 640, 220, 42, "#ff7777");
      this.text(c, this.reason || "Объект победил.", 640, 350, 20, "#fff", "center", false);
      this.button(c, 430, 425, 420, 56, "ПОВТОРИТЬ", () => this.startLevel(this.levelIndex));
      this.button(c, 430, 495, 420, 56, "В МЕНЮ", () => this.state = GameState.MENU);
    }

    else if (this.state === GameState.FINISHED) {
      this.text(c, "ПОБЕДА!", 640, 220, 42, "#8cff8c");
      this.text(c, "Дом построен. Возможно, это коровник.", 640, 350, 22, "#fff", "center", false);
      this.button(c, 430, 440, 420, 56, "ЗАНОВО", () => this.startLevel(0));
    }

    else if (this.state === GameState.SKINS) {
      this.text(c, "ВЫБЕРИ СВОЕГО ПРИМАТА", 640, 140, 36, "#8cff8c");

      for (let i = 0; i < SKINS.length; i++) {
        const x = 120 + i * 260;
        const y = 220;
        this.buttons.push({
          x,
          y,
          w: 190,
          h: 230,
          action: () => {
            this.selectedSkin = i;
            saveLocal("mtr_skin", i);
          }
        });

        this.drawSkinPreview(c, x + 95, y + 105, i, this.selectedSkin === i);
      }

      this.button(c, 430, 610, 420, 50, "НАЗАД", () => this.state = GameState.MENU);
    }

    else if (this.state === GameState.RECORDS) {
      this.text(c, "МАРТЫШКИНЫ РЕКОРДЫ", 640, 180, 40, "#fff08a");

      if (!this.records.length) {
        this.text(c, "Пока пусто. Ни один примат ещё не оформил героический отчёт.", 640, 350, 22, "#fff", "center", false);
      } else {
        this.records.forEach((r, i) => {
          this.text(c, `${i + 1}. ${r.name}    SCORE ${r.score}    LEVEL ${r.level}/10`, 640, 285 + i * 34, 22, i ? "#fff" : "#fff08a");
        });
      }

      this.button(c, 430, 610, 420, 50, "НАЗАД", () => this.state = GameState.MENU);
    }

    else if (this.state === GameState.LEVEL_SELECT) {
      this.text(c, "ВЫБОР УРОВНЯ", 640, 160, 40, "#8cff8c");
      this.text(c, "Открытые уровни сохраняются. Закрытые пока под замком.", 640, 210, 16, "#fff", "center", false);

      for (let i = 0; i < LEVELS.length; i++) {
        const row = Math.floor(i / 5);
        const col = i % 5;
        const x = 170 + col * 190;
        const y = 285 + row * 85;
        const open = i < this.unlockedLevel;

        this.button(c, x, y, 160, 55, `${open ? "УРОВЕНЬ " : "🔒 "}${i + 1}`, () => {
          if (open) this.startLevel(i);
        }, {
          stroke: open ? "#8cff8c" : "#7a7a7a",
          fill: open ? "rgba(20,40,20,0.7)" : "rgba(30,30,30,0.7)"
        });
      }

      this.button(c, 430, 610, 420, 50, "НАЗАД", () => this.state = GameState.MENU);
    }

    else if (this.state === GameState.SETTINGS) {
      this.text(c, "ЗВУК", 640, 180, 42, "#8cff8c");

      this.button(c, 410, 300, 460, 55, `Музыка: ${this.audio.music ? "ON" : "OFF"}`, () => {
        this.audio.music = !this.audio.music;
        this.audio.save();
      });

      this.button(c, 410, 370, 460, 55, `Эффекты: ${this.audio.sfx ? "ON" : "OFF"}`, () => {
        this.audio.sfx = !this.audio.sfx;
        this.audio.save();
      });

      this.button(c, 410, 440, 460, 55, `Музыка громкость: ${Math.round(this.audio.musicVolume * 100)}%`, () => {
        this.audio.musicVolume = this.audio.musicVolume >= 1 ? 0.25 : Math.round((this.audio.musicVolume + 0.25) * 100) / 100;
        this.audio.save();
      });

      this.button(c, 410, 510, 460, 55, `Эффекты громкость: ${Math.round(this.audio.sfxVolume * 100)}%`, () => {
        this.audio.sfxVolume = this.audio.sfxVolume >= 1 ? 0.25 : Math.round((this.audio.sfxVolume + 0.25) * 100) / 100;
        this.audio.save();
      });

      this.button(c, 430, 610, 420, 50, "НАЗАД", () => this.state = GameState.MENU);
    }
  }

  drawSkinPreview(c, x, y, index, selected = false) {
    const sk = SKINS[index];

    this.fillRound(c, x - 95, y - 105, 190, 230, 12, selected ? "rgba(60,120,45,0.28)" : "rgba(15,18,15,0.72)");
    this.strokeRound(c, x - 95, y - 105, 190, 230, 12, selected ? "#fff478" : "#8cff8c", 2);

    // Tail
    c.strokeStyle = sk.fur;
    c.lineWidth = 4;
    c.beginPath();
    c.arc(x - 45, y + 36, 32, 0.2, 5.1);
    c.stroke();

    // Body
    c.fillStyle = sk.fur;
    c.beginPath();
    c.ellipse(x, y + 38, 29, 24, 0, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = sk.face;
    c.beginPath();
    c.ellipse(x, y + 43, 15, 11, 0, 0, Math.PI * 2);
    c.fill();

    // Head
    c.fillStyle = sk.fur;
    c.beginPath();
    c.arc(x - 22, y - 5, 10, 0, Math.PI * 2);
    c.arc(x + 22, y - 5, 10, 0, Math.PI * 2);
    c.arc(x, y - 5, 22, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = sk.face;
    c.beginPath();
    c.ellipse(x, y, 13, 8.5, 0, 0, Math.PI * 2);
    c.fill();

    // Helmet
    this.fillRound(c, x - 20, y - 30, 40, 13, 7, sk.helmet);

    c.fillStyle = "#111";
    c.beginPath();
    c.arc(x - 5.5, y - 6.5, 1.8, 0, Math.PI * 2);
    c.arc(x + 5.5, y - 6.5, 1.8, 0, Math.PI * 2);
    c.fill();

    // Limbs
    c.strokeStyle = sk.accent;
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(x - 16, y + 56);
    c.lineTo(x - 25, y + 78);
    c.moveTo(x + 16, y + 56);
    c.lineTo(x + 25, y + 78);
    c.moveTo(x - 18, y + 28);
    c.lineTo(x - 36, y + 36);
    c.moveTo(x + 18, y + 28);
    c.lineTo(x + 34, y + 18);
    c.stroke();

    this.text(c, SKINS[index].name, x, y + 108, 16, "#fff");
  }
}

new Game();
</script>
</body>
</html>
