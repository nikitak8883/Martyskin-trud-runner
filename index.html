function intersect(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function seeded(seed){let s=seed>>>0; return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296);} 
class AudioEngine{
  constructor(){this.ctx=null; this.music=get('music',true); this.sfx=get('sfx',true); this.mv=get('musicVolume',0.55); this.sv=get('sfxVolume',0.82); this.step=0; this.next=0;}
  ensure(){ if(this.ctx) return; const A=window.AudioContext||window.webkitAudioContext; if(A) this.ctx=new A(); }
  resume(){ this.ensure(); if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); }
  tone(f,d=.1,t='sine',v=.04,delay=0){ if(!this.ctx) return; let now=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=t; o.frequency.setValueAtTime(f,now); g.gain.setValueAtTime(.0001,now); g.gain.linearRampToValueAtTime(v,now+.01); g.gain.exponentialRampToValueAtTime(.0001,now+d); o.connect(g); g.connect(this.ctx.destination); o.start(now); o.stop(now+d+.03); }
  chirp(a,b,d=.08,v=.12){ if(!this.ctx) return; let now=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='square'; o.frequency.setValueAtTime(a,now); o.frequency.exponentialRampToValueAtTime(b,now+d); g.gain.setValueAtTime(.0001,now); g.gain.linearRampToValueAtTime(v*this.sv,now+.01); g.gain.exponentialRampToValueAtTime(.0001,now+d); o.connect(g); g.connect(this.ctx.destination); o.start(now); o.stop(now+d+.04); }
  play(name){ if(!this.sfx) return; this.resume(); if(name==='jump') this.chirp(430,890,.1,.13); else if(name==='dash') this.chirp(260,760,.12,.16); else if(name==='banana'){this.chirp(880,1250,.06,.09); this.tone(1180,.08,'square',.03*this.sv,.02);} else if(name==='hit') this.chirp(320,125,.15,.18); else if(name==='banner') this.chirp(580,990,.09,.1); else if(name==='clear') [523,659,784,1046].forEach((f,i)=>this.tone(f,.12,'square',.06*this.sv,i*.08)); else if(name==='monkey'){this.chirp(470,820,.08,.13); this.chirp(660,980,.06,.09);} }
  tick(){ if(!this.music) return; this.resume(); if(!this.ctx || this.ctx.currentTime<this.next) return; const roots=[196,220,262,220,175,196,220,262], r=roots[Math.floor(this.step/8)%roots.length], m=[2,2.25,2.66,3,2.66,2.25,2,3][this.step%8]; this.tone(r*m,.18,'square',this.mv*.045); if(this.step%2===0) this.tone(r/2,.12,'sine',this.mv*.05); if(this.step%16===3||this.step%16===11) this.chirp(620,940,.07,this.mv*.06); this.next=this.ctx.currentTime+.25; this.step++; }
  save(){ set('music',this.music); set('sfx',this.sfx); set('musicVolume',this.mv); set('sfxVolume',this.sv); }
}
class RenderEngine{
  constructor(canvas){ this.canvas=canvas; this.ctx=canvas.getContext('2d'); this.scene=document.createElement('canvas'); this.glow=document.createElement('canvas'); this.scene.width=this.glow.width=W; this.scene.height=this.glow.height=H; this.sctx=this.scene.getContext('2d'); this.gctx=this.glow.getContext('2d'); this.scale=1; this.ox=0; this.oy=0; this.resize(); }
  resize(){ const dpr=Math.min(2,window.devicePixelRatio||1); this.canvas.width=innerWidth*dpr; this.canvas.height=innerHeight*dpr; this.ctx.setTransform(dpr,0,0,dpr,0,0); this.scale=Math.min(innerWidth/W, innerHeight/H); this.ox=(innerWidth-W*this.scale)/2; this.oy=(innerHeight-H*this.scale)/2; }
  begin(){ this.sctx.clearRect(0,0,W,H); this.gctx.clearRect(0,0,W,H); return this.sctx; }
  glowCircle(x,y,r,color,alpha=.4){ const c=this.gctx; c.save(); c.globalAlpha=alpha; let g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,color); g.addColorStop(1,'transparent'); c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); c.restore(); }
  end(){ const c=this.ctx; c.save(); c.fillStyle='#020302'; c.fillRect(0,0,innerWidth,innerHeight); c.translate(this.ox,this.oy); c.scale(this.scale,this.scale);
    c.globalAlpha=.55; c.filter='blur(10px)'; c.drawImage(this.glow,0,0); c.filter='none'; c.globalAlpha=1; c.drawImage(this.scene,0,0);
    c.globalAlpha=.22; c.filter='blur(4px)'; c.drawImage(this.scene,-3,-3,W+6,H+6); c.filter='none'; c.globalAlpha=1;
    let g=c.createRadialGradient(W*.5,H*.45,W*.14,W*.5,H*.45,W*.74); g.addColorStop(.58,'transparent'); g.addColorStop(1,'rgba(0,0,0,.48)'); c.fillStyle=g; c.fillRect(0,0,W,H);
    c.fillStyle='rgba(255,255,255,.025)'; for(let y=0;y<H;y+=4) c.fillRect(0,y,W,1);
    c.restore();
  }
  point(clientX,clientY){ return {x:(clientX-this.ox)/this.scale, y:(clientY-this.oy)/this.scale}; }
}
class Game{
  constructor(){
    this.engine=new RenderEngine(document.getElementById('game')); this.audio=new AudioEngine(); this.state=ST.MENU; this.buttons=[]; this.name=get('name','Примат'); this.skin=get('skin',0); this.records=get('records',[]); this.unlocked=get('unlocked',1); this.showSettings=false; this.last=0; this.level=0; this.initGame(); this.bind(); requestAnimationFrame(t=>this.loop(t));
  }
  initGame(){ this.player={x:250,y:560,vy:0,onGround:true,doubleJump:true}; this.progress=0; this.score=0; this.hp=3; this.bananasCollected=0; this.invincible=0; this.dashTimer=0; this.dashCooldown=0; this.jumpBoost=0; this.armor=0; this.magnet=0; this.banner=''; this.bannerTimer=0; this.storyStage=-1; this.shake=0; this.particles=[]; this.generate(); }
  start(lvl=0){ this.level=clamp(lvl,0,LEVELS.length-1); this.state=ST.PLAY; this.initGame(); }
  generate(){ const level=LEVELS[this.level], rand=seeded(1000+this.level*771);
    this.platforms=[]; this.bananas=[]; this.obstacles=[]; this.bonuses=[]; this.npcs=[];
    for(let x=620;x<level.length-600;x+=620+rand()*300){ let y=560-(95+rand()*90), w=90+rand()*120, type=Math.floor(rand()*4); this.platforms.push({x,y,w,type}); if(rand()<.42) this.platforms.push({x:x+w+90+rand()*120,y:clamp(y+(rand()*80-40),330,470),w:80+rand()*110,type:Math.floor(rand()*4)}); }
    for(let x=380;x<level.length-500;x+=520+rand()*260){ let n=4+Math.floor(rand()*4), base=520-rand()*30; for(let i=0;i<n;i++) this.bananas.push({x:x+i*62,y:base-Math.sin(i/Math.max(1,n-1)*Math.PI)*32,taken:false,wx:x+i*62}); }
    for(let p of this.platforms){ let n=2+Math.floor(rand()*4); for(let i=0;i<n;i++) this.bananas.push({x:p.x+20+i*(p.w-40)/Math.max(1,n-1), y:p.y-34-(i%2)*8, taken:false}); }
    let pool=[0,1,2,6,7,8,9]; if(this.level>0) pool.push(3); if(this.level>3) pool.push(4,5);
    for(let x=900;x<level.length-500;x+=720+rand()*360){ this.obstacles.push({x,y:560,type:pool[Math.floor(rand()*pool.length)], dead:false}); if(rand()<.25+level.theme*.04) this.obstacles.push({x:x+170+rand()*140,y:560,type:pool[Math.floor(rand()*pool.length)],dead:false}); }
    for(let x=1600;x<level.length-800;x+=1800+rand()*900) this.bonuses.push({x,y:390+rand()*100,type:Math.floor(rand()*4),taken:false});
    if(this.level>=3) for(let x=2400;x<level.length-1000;x+=2600+rand()*900) this.npcs.push({anchor:x, range:110+rand()*80, speed:.8+rand()*1.4, skin:Math.floor(rand()*4), dead:false, t:rand()*10});
  }
  bind(){ window.addEventListener('resize',()=>this.engine.resize()); const tap=(e)=>{ this.audio.resume(); let p=e.touches?e.touches[0]:e; let q=this.engine.point(p.clientX,p.clientY); this.handleTap(q.x,q.y); if(e.cancelable) e.preventDefault(); };
    this.engine.canvas.addEventListener('mousedown',tap); this.engine.canvas.addEventListener('touchstart',tap,{passive:false});
    window.addEventListener('keydown',(e)=>{ if(e.key==='p'||e.key==='Escape'){ if(this.state===ST.PLAY) this.state=ST.PAUSE; else if(this.state===ST.PAUSE) this.state=ST.PLAY; } if(this.state===ST.PLAY&&(e.key===' '||e.key==='ArrowUp')) this.jump(); if(this.state===ST.PLAY&&(e.key==='ArrowRight'||e.key==='d')) this.dash(); }); }
  handleTap(x,y){ for(let b of this.buttons){ if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ b.f(); return; } }
    if(this.state===ST.PLAY){ if(x<W*.58) this.jump(); else this.dash(); }
  }
  jump(){ const p=this.player; if(p.onGround){ p.vy=-(this.jumpBoost>0?630:540); p.onGround=false; p.doubleJump=true; this.audio.play('jump'); }
    else if(p.doubleJump){ p.vy=-(this.jumpBoost>0?560:470); p.doubleJump=false; this.audio.play('jump'); } }
  dash(){ if(this.dashCooldown<=0){ this.dashTimer=.34; this.dashCooldown=1.0; this.audio.play('dash'); this.emit(this.player.x+20,this.player.y-30,'#fff06a',20); } }
  worldX(x){ return 250+(x-this.progress); }
  playerRect(){ return {x:this.player.x-24,y:this.player.y-70,w:48,h:66}; }
  obstacleRect(sx, bottom, t){ const o=TYPE[t]||TYPE[0]; return {x:sx-o.w/2, y:bottom-o.h, w:o.w, h:o.h}; }
  emit(x,y,c,n){ for(let i=0;i<n;i++){ let a=Math.random()*Math.PI*2,s=80+Math.random()*280; this.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.55,size:2+Math.random()*4,c}); } }
  activateBonus(t){ if(t===0) this.jumpBoost=8; else if(t===1) this.dashCooldown=0; else if(t===2) this.armor=8; else if(t===3) this.magnet=8; }
  saveRecord(){ let r=this.records.find(v=>v.name===this.name); if(!r){ r={name:this.name,score:0,level:0}; this.records.push(r);} r.score=Math.max(r.score,this.score); r.level=Math.max(r.level,this.level+1); this.records.sort((a,b)=>b.score-a.score); this.records=this.records.slice(0,8); set('records',this.records); this.unlocked=Math.max(this.unlocked,this.level+2); set('unlocked',this.unlocked); }
  update(dt){ const level=LEVELS[this.level]; this.audio.tick(); this.invincible-=dt; this.dashTimer-=dt; this.dashCooldown-=dt; this.jumpBoost-=dt; this.armor-=dt; this.magnet-=dt; this.bannerTimer-=dt; this.shake-=dt;
    this.progress += level.speed * (this.dashTimer>0?1.9:1) * dt;
    let st=Math.min(3,Math.floor(this.progress/level.length*4)); if(st!==this.storyStage){ this.storyStage=st; this.banner=STORY[level.theme][st]; this.bannerTimer=2.8; this.audio.play('banner'); }
    let p=this.player, prevY=p.y; p.vy += (p.vy>0?1200:1500)*dt; p.y += p.vy*dt; p.onGround=false;
    for(let pl of this.platforms){ let sx=this.worldX(pl.x); if(p.x+24>sx && p.x-24<sx+pl.w && prevY<=pl.y && p.y>=pl.y && p.vy>=0){ p.y=pl.y; p.vy=0; p.onGround=true; p.doubleJump=true; } }
    if(p.y>560){ p.y=560; p.vy=0; p.onGround=true; p.doubleJump=true; }
    let pr=this.playerRect();
    for(let b of this.bananas){ if(b.taken) continue; let sx=this.worldX(b.x); if(this.magnet>0 && Math.hypot(sx-p.x, b.y-(p.y-40))<170) b.x += ((this.progress+1)-(b.x))*0.0015*dt*60; if(sx>-40&&sx<W+40 && intersect(pr,{x:sx-18,y:b.y-16,w:36,h:30})){ b.taken=true; this.bananasCollected++; this.score += 15+this.level; this.emit(sx,b.y,'#ffe75a',10); this.audio.play('banana'); } }
    for(let bo of this.bonuses){ if(bo.taken) continue; let sx=this.worldX(bo.x); if(intersect(pr,{x:sx-26,y:bo.y-26,w:52,h:52})){ bo.taken=true; this.activateBonus(bo.type); this.emit(sx,bo.y,'#b7ff8a',24); this.audio.play('monkey'); } }
    for(let npc of this.npcs){ if(npc.dead) continue; npc.t += dt; let wx=npc.anchor+Math.sin(npc.t*npc.speed+npc.skin*1.7)*npc.range; let sx=this.worldX(wx), rr={x:sx-30,y:560-78,w:60,h:78}; if(pr.x+pr.w>rr.x && pr.x<rr.x+rr.w && pr.y+pr.h>rr.y && pr.y<rr.y+rr.h){ if(p.vy>80 && pr.y+pr.h-8<rr.y+18){ npc.dead=true; p.vy=-380; this.score+=40; if(Math.random()<.5){ this.activateBonus(Math.floor(Math.random()*4)); } else { this.bananasCollected+=2; this.score+=30; } this.emit(sx,520,'#ffef70',20); this.audio.play('monkey'); } else if(this.invincible<=0){ if(this.armor>0){ npc.dead=true; this.emit(sx,520,'#9cff8a',20); break; } this.hp--; this.invincible=1; this.shake=.25; this.audio.play('hit'); this.emit(sx,520,'#ff6969',24); if(this.hp<=0){ this.reason='Динамическое препятствие оказалось умнее примата.'; this.saveRecord(); this.state=ST.OVER; return; } } } }
    if(this.invincible<=0) for(let o of this.obstacles){ if(o.dead) continue; let sx=this.worldX(o.x), rr=this.obstacleRect(sx,o.y,o.type); if(sx>-120&&sx<W+120 && intersect(pr,rr)){ if(this.armor>0){ o.dead=true; this.emit(sx,o.y-40,'#9cff8a',18); break; } this.hp--; this.invincible=1; this.shake=.25; this.audio.play('hit'); this.emit(sx,o.y-40,'#ff6969',22); if(this.hp<=0){ this.reason='Объект победил мартышку. Отчёт, конечно, всё равно успешный.'; this.saveRecord(); this.state=ST.OVER; return; } break; } }
    if(this.progress>=level.length){ if(this.bananasCollected>=level.target){ this.score += this.hp*100; this.saveRecord(); this.audio.play('clear'); this.state=this.level===LEVELS.length-1?ST.WIN:ST.CLEAR; }
      else { this.reason='Бананов не хватило. Норма есть норма.'; this.saveRecord(); this.state=ST.OVER; } }
    this.particles=this.particles.filter(p=>(p.life-=dt)>0); for(let q of this.particles){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=300*dt; }
  }
  loop(ts){ let dt=Math.min(.033,(ts-(this.last||ts))/1000); this.last=ts; if(this.state===ST.PLAY) this.update(dt); this.render(); requestAnimationFrame(t=>this.loop(t)); }
  // draw helpers
  round(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
  text(c,t,x,y,s,col='#fff',align='center',bold=true){ c.font=(bold?'bold ':'')+s+'px monospace'; c.textAlign=align; c.fillStyle=col; c.shadowColor='rgba(0,0,0,.8)'; c.shadowBlur=4; c.fillText(t,x,y); c.shadowBlur=0; }

    c.fillStyle=sk.fur; c.beginPath(); c.arc(cx-27,bottom-62,11,0,Math.PI*2); c.arc(cx+27,bottom-62,11,0,Math.PI*2); c.arc(cx,bottom-62,22.5,0,Math.PI*2); c.fill();
    c.fillStyle=sk.face; c.beginPath(); c.ellipse(cx,bottom-57,15.5,9,0,0,Math.PI*2); c.fill();
    c.fillStyle='#1e1912'; c.beginPath(); c.arc(cx-7,bottom-63,2.2,0,Math.PI*2); c.arc(cx+7,bottom-63,2.2,0,Math.PI*2); c.fill(); c.strokeStyle='#1e1912'; c.lineWidth=1.8; c.beginPath(); c.arc(cx,bottom-56,7,.45,2.68); c.stroke();
    // helmet
    c.fillStyle=sk.helm; this.round(c,cx-22,bottom-90,44,12,6); c.fill(); c.fillStyle='#231e14'; c.fillRect(cx-20,bottom-82.5,40,5.5);
    // limbs
    c.strokeStyle='#5f371c'; c.lineWidth=4.2; c.beginPath(); c.moveTo(cx-18,bottom-20); c.lineTo(cx-30,bottom+1); c.moveTo(cx+18,bottom-20); c.lineTo(cx+30,bottom+1); c.moveTo(cx-22,bottom-40); c.lineTo(cx-44,bottom-32); c.moveTo(cx+22,bottom-40); c.lineTo(cx+42,bottom-49); c.stroke();
    // rainbow trail
    let cols=['#ff3246','#ff9128','#ffe637','#50eb5a','#46aaff','#af5aff']; let top=bottom-50, len=Math.min(W*.28,180); for(let i=0;i<cols.length;i++){ c.fillStyle=`rgba(${parseInt(cols[i].slice(1,3),16)},${parseInt(cols[i].slice(3,5),16)},${parseInt(cols[i].slice(5,7),16)},${this.invincible>0?.58:.78})`; this.round(c,cx-24-len,top+i*7.8, len, 6.6,3); c.fill(); }
    if(this.dashTimer>0) this.text(c,'РЫВОК!',cx,bottom-114,20,'#fff05a');
    this.engine.glowCircle(cx,bottom-55,45,'#ffe890',.12);
  }
  drawSkinPreview(c,x,y,i,selected=false){ let sk=SKINS[i]; c.fillStyle=selected?'rgba(60,120,45,.25)':'rgba(15,18,15,.55)'; this.round(c,x-95,y-105,190,230,12); c.fill(); c.strokeStyle=selected?'#fff478':'#8cff8c'; c.lineWidth=2; c.stroke();
    // preview monkey head/body
    c.fillStyle=sk.fur; c.beginPath(); c.arc(x-22,y-5,10,0,Math.PI*2); c.arc(x+22,y-5,10,0,Math.PI*2); c.arc(x,y-5,22,0,Math.PI*2); c.ellipse(x,y+38,29,24,0,0,Math.PI*2); c.fill(); c.fillStyle=sk.face; c.beginPath(); c.ellipse(x,y,13,8.5,0,0,Math.PI*2); c.ellipse(x,y+43,15,11,0,0,Math.PI*2); c.fill(); c.fillStyle=sk.helm; this.round(c,x-20,y-30,40,13,7); c.fill(); c.fillStyle='#000'; c.beginPath(); c.arc(x-5.5,y-6.5,1.8,0,Math.PI*2); c.arc(x+5.5,y-6.5,1.8,0,Math.PI*2); c.fill(); c.strokeStyle='#5f371c'; c.lineWidth=3; c.beginPath(); c.moveTo(x-16,y+56); c.lineTo(x-25,y+78); c.moveTo(x+16,y+56); c.lineTo(x+25,y+78); c.moveTo(x-18,y+28); c.lineTo(x-36,y+36); c.moveTo(x+18,y+28); c.lineTo(x+34,y+18); c.stroke();
    this.text(c,SKINS[i].name,x,y+108,16,'#fff'); }
  drawFinish(c,x){ c.fillStyle='#c0c0c0'; c.fillRect(x,420,6,140); let s=20; for(let r=0;r<5;r++) for(let k=0;k<4;k++){ c.fillStyle=(r+k)%2?'#000':'#fff'; c.fillRect(x+6+k*s,420+r*s,s,s); } this.text(c,'ФИНИШ',x+50,400,22,'#8cff8c'); }
  drawParticles(c){ for(let p of this.particles){ let a=clamp(p.life/.9,0,1); c.fillStyle=p.c; c.globalAlpha=a; c.beginPath(); c.arc(p.x,p.y,p.size,0,Math.PI*2); c.fill(); c.strokeStyle=p.c; c.lineWidth=Math.max(1,p.size*.6); c.globalAlpha=a*.45; c.beginPath(); c.moveTo(p.x-p.vx*.035,p.y-p.vy*.035); c.lineTo(p.x,p.y); c.stroke(); } c.globalAlpha=1; }
  drawOverlayFx(c){ // dust and haze
    let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(255,220,120,.08)'); c.fillStyle=g; c.fillRect(0,H*.5,W,H*.5); for(let i=0;i<24;i++){ let px=(i*97/8 + this.last*0.012*(12+(i%5)*3))%(W+60)-20, py=(H*(.15+(i%9)*.07)+Math.sin(this.last*0.0007+i)*14); c.fillStyle=`rgba(255,250,220,${.07+(i%4)*.03})`; c.beginPath(); c.arc(px,py,.9+(i%3)*.6,0,Math.PI*2); c.fill(); }
    if(this.bannerTimer>0 && !(this.bannerTimer<.6 && Math.floor(this.bannerTimer*12)%2===0)){ c.fillStyle='rgba(0,0,0,.72)'; this.round(c,350,105,580,55,12); c.fill(); c.strokeStyle='#fff08a'; c.lineWidth=3; c.stroke(); this.text(c,this.banner,640,140,22,'#fff08a'); }
  }
  drawHUD(c){ if(this.state!==ST.PLAY) return; const level=LEVELS[this.level]; c.fillStyle='rgba(0,0,0,.55)'; this.round(c,12,12,1256,72,12); c.fill(); this.text(c,level.name,28,40,20,'#8cff8c','left'); this.text(c,level.subtitle,28,65,14,'#d7ffd7','left',false);
    let percent=Math.min(100,Math.floor(this.progress/level.length*100)); let hud=`${this.name}    BAN ${this.bananasCollected}/${level.target}    HP ${this.hp}    SCORE ${this.score}    ${percent}%`; this.text(c,hud,1250,45,18,'#fff08a','right');
    let barW=W*.26, barH=8, bx=W-24-barW, by=56; c.fillStyle='rgba(255,255,255,.3)'; this.round(c,bx,by,barW,barH,barH/2); c.fill(); c.fillStyle='#64ff78'; this.round(c,bx,by,barW*Math.min(1,this.progress/level.length),barH,barH/2); c.fill();
    let status=''; if(this.jumpBoost>0) status += ' JUMP+ '+Math.ceil(this.jumpBoost)+'s'; if(this.dashCooldown<=0&&this.dashTimer<=0){} else if(this.dashTimer<=0) status += ' DASH '+Math.max(0,this.dashCooldown).toFixed(1)+'s'; if(this.armor>0) status += ' ARMOR '+Math.ceil(this.armor)+'s'; if(this.magnet>0) status += ' MAGNET '+Math.ceil(this.magnet)+'s'; if(status) this.text(c,status,28,92,14,'#fff08a','left');
    this.button(c,1130,95,120,42,'ПАУЗА',()=>this.state=ST.PAUSE,'#fff08a','rgba(0,0,0,.55)','#fff08a'); this.button(c,45,615,470,72,'ПРЫЖОК / ПЛАНИРОВАНИЕ',()=>this.jump(),'rgba(120,255,120,.15)','rgba(60,120,60,.18)','rgba(200,255,200,.9)'); this.button(c,820,615,410,72,this.dashCooldown<=0?'РЫВОК':`РЫВОК: ${this.dashCooldown.toFixed(1)}`,()=>this.dash(),'rgba(255,235,90,.15)','rgba(90,90,40,.18)','rgba(255,235,90,.95)'); }
  drawMenu(c){ c.fillStyle='rgba(0,0,0,.76)'; c.fillRect(0,0,W,H);
    if(this.state===ST.MENU){ this.text(c,'ГЛАВНОЕ МЕНЮ',640,180,42,'#8cff8c'); this.text(c,'Web-порт последней Android-версии: больше эффектов, лучше рендер, меньше боли.',640,235,18,'#fff'); this.button(c,430,285,420,56,'ВПЕРЁД, ПРИМАТЫ!',()=>{ this.name=(prompt('Имя примата:',this.name)||this.name).slice(0,24)||'Безымянный примат'; set('name',this.name); this.start(0); }); this.button(c,430,355,420,52,'ВЫБЕРИ СВОЕГО ПРИМАТА',()=>this.state=ST.SKINS); this.button(c,430,420,420,52,'МАРТЫШКИНЫ РЕКОРДЫ',()=>this.state=ST.RECORDS); this.button(c,430,485,420,52,'ВЫБОР УРОВНЯ',()=>this.state=ST.LEVELS); this.button(c,430,550,420,52,'ЗВУК',()=>this.state=ST.SETTINGS); }
    else if(this.state===ST.PAUSE){ this.text(c,'ПАУЗА',640,220,42,'#8cff8c'); this.button(c,430,330,420,56,'ПРОДОЛЖИТЬ',()=>this.state=ST.PLAY); this.button(c,430,400,420,56,'В МЕНЮ',()=>this.state=ST.MENU); }
    else if(this.state===ST.CLEAR){ this.text(c,'УРОВЕНЬ ПРОЙДЕН',640,220,42,'#8cff8c'); this.text(c,'Мартышка выжила. Объект всё ещё сомнительный, но бананы уже в кармане.',640,350,20); this.button(c,430,430,420,56,'СЛЕДУЮЩИЙ',()=>this.start(this.level+1)); }
    else if(this.state===ST.OVER){ this.text(c,'МАРТЫШКА УПАЛА',640,220,42,'#ff7777'); this.text(c,this.reason||'Объект победил.',640,350,20); this.button(c,430,425,420,56,'ПОВТОРИТЬ',()=>this.start(this.level)); this.button(c,430,495,420,56,'В МЕНЮ',()=>this.state=ST.MENU); }
    else if(this.state===ST.WIN){ this.text(c,'ПОБЕДА!',640,220,42,'#8cff8c'); this.text(c,'Дом построен. Возможно, это коровник.',640,350,22); this.button(c,430,440,420,56,'ЗАНОВО',()=>this.start(0)); }
    else if(this.state===ST.SKINS){ this.text(c,'ВЫБЕРИ СВОЕГО ПРИМАТА',640,140,36,'#8cff8c'); for(let i=0;i<4;i++){ this.buttons.push({x:120+i*260,y:220,w:190,h:230,f:()=>{this.skin=i; set('skin',i);}}); this.drawSkinPreview(c,215+i*260,325,i,this.skin===i); } this.button(c,430,610,420,50,'НАЗАД',()=>this.state=ST.MENU); }
    else if(this.state===ST.RECORDS){ this.text(c,'МАРТЫШКИНЫ РЕКОРДЫ',640,180,40,'#fff08a'); if(!this.records.length) this.text(c,'Пока пусто. Ни один примат ещё не оформил героический отчёт.',640,350,22,'#fff'); else this.records.forEach((r,i)=>this.text(c,`${i+1}. ${r.name}    SCORE ${r.score}    LEVEL ${r.level}/10`,640,285+i*34,22,i?'#fff':'#fff08a')); this.button(c,430,610,420,50,'НАЗАД',()=>this.state=ST.MENU); }
    else if(this.state===ST.LEVELS){ this.text(c,'ВЫБОР УРОВНЯ',640,160,40,'#8cff8c'); this.text(c,'Открытые уровни сохраняются. Закрытые пока под замком.',640,210,16,'#fff'); for(let i=0;i<10;i++){ let row=Math.floor(i/5), col=i%5, x=170+col*190, y=285+row*85, open=i<this.unlocked; this.button(c,x,y,160,55,(open?'УРОВЕНЬ ':'🔒 ')+(i+1),()=>{ if(open) this.start(i); }, open?'#8cff8c':'#7a7a7a', open?'rgba(20,40,20,.7)':'rgba(30,30,30,.7)'); } this.button(c,430,610,420,50,'НАЗАД',()=>this.state=ST.MENU); }
    else if(this.state===ST.SETTINGS){ this.text(c,'ЗВУК',640,180,42,'#8cff8c'); this.button(c,410,300,460,55,'Музыка: '+(this.audio.music?'ON':'OFF'),()=>{this.audio.music=!this.audio.music; this.audio.save();}); this.button(c,410,370,460,55,'Эффекты: '+(this.audio.sfx?'ON':'OFF'),()=>{this.audio.sfx=!this.audio.sfx; this.audio.save();}); this.button(c,410,440,460,55,'Музыка громкость: '+Math.round(this.audio.mv*100)+'%',()=>{this.audio.mv=(this.audio.mv>=1?.25:Math.round((this.audio.mv+.25)*100)/100); this.audio.save();}); this.button(c,410,510,460,55,'Эффекты громкость: '+Math.round(this.audio.sv*100)+'%',()=>{this.audio.sv=(this.audio.sv>=1?.25:Math.round((this.audio.sv+.25)*100)/100); this.audio.save();}); this.button(c,430,610,420,50,'НАЗАД',()=>this.state=ST.MENU); }
  }
  render(){ const c=this.engine.begin(); this.buttons=[]; if(this.shake>0) c.translate((Math.random()-.5)*this.shake*18,(Math.random()-.5)*this.shake*14); this.drawBackground(c); this.drawWorld(c); this.drawMonkey(c); this.drawParticles(c); this.drawOverlayFx(c); this.drawHUD(c); if(this.state!==ST.PLAY) this.drawMenu(c); this.engine.end(); }
}
new Game();
</script>
